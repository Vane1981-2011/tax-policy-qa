        else if (k.slice(0, 2) === 'on') el.addEventListener(k.slice(2), v);
        else if (k === 'dataset') { for (var dk in v) el.dataset[dk] = v[dk]; }
        else el.setAttribute(k, v);
      }
    }
    if (kids != null) {
      var arr = Array.isArray(kids) ? kids : [kids];
      for (var i = 0; i < arr.length; i++) {
        var c = arr[i];
        if (c == null || c === false) continue;
        el.appendChild(typeof c === 'string' || typeof c === 'number' ? document.createTextNode(String(c)) : c);
      }
    }
    return el;
  }

  function clear(el) { while (el.firstChild) el.removeChild(el.firstChild); }

  function svgIcon(path, size) {
    var ns = 'http://www.w3.org/2000/svg';
    var s = document.createElementNS(ns, 'svg');
    s.setAttribute('width', size || 14); s.setAttribute('height', size || 14);
    s.setAttribute('viewBox', '0 0 24 24'); s.setAttribute('fill', 'none');
    s.setAttribute('stroke', 'currentColor'); s.setAttribute('stroke-width', '1.8');
    s.setAttribute('stroke-linecap', 'round'); s.setAttribute('stroke-linejoin', 'round');
    var p = document.createElementNS(ns, 'path');
    p.setAttribute('d', path);
    s.appendChild(p);
    return s;
  }

  /* ---------------- 提示 ---------------- */

  function toast(msg, kind) {
    var el = h('div', { class: 'toast', dataset: { kind: kind || 'ok' } }, [
      h('span', { class: 'ic' }, svgIcon(kind === 'err' ? 'M12 8v8m0 4h.01' : 'M20 6L9 17l-5-5', 13)),
      h('span', { text: msg })
    ]);
    dom.toasts.appendChild(el);
    setTimeout(function () {
      el.style.transition = 'opacity .2s, transform .2s';
      el.style.opacity = '0';
      el.style.transform = 'translateY(6px)';
      setTimeout(function () { el.remove(); }, 220);
    }, kind === 'err' ? 4200 : 2600);
    while (dom.toasts.children.length > 3) dom.toasts.firstChild.remove();
  }

  function copy(text, tip) {
    var done = function () { toast(tip || '已复制'); };
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(done, function () { fallback(); });
    } else fallback();
    function fallback() {
      var ta = h('textarea', { style: 'position:fixed;left:-9999px' });
      ta.value = text;
      document.body.appendChild(ta);
      ta.select();
      try { document.execCommand('copy'); done(); } catch (e) { toast('复制失败', 'err'); }
      ta.remove();
    }
  }

  /* ---------------- 主题 ---------------- */

  function applyTheme() {
    document.documentElement.setAttribute('data-theme', state.theme);
    var meta = document.querySelector('meta[name="theme-color"]');
    if (meta) meta.setAttribute('content', state.theme === 'ink' ? '#0D1013' : '#F1F2F4');
    dom.themeBtn.setAttribute('aria-pressed', state.theme === 'ink' ? 'true' : 'false');
    dom.themeBtn.title = state.theme === 'ink' ? '切换到纸白（浅色）' : '切换到墨黑（深色）';
  }

  function toggleTheme() {
    state.theme = state.theme === 'ink' ? 'paper' : 'ink';
    App.store.set('tsq3.theme', state.theme);
    applyTheme();
  }

  /* ---------------- Dock ---------------- */

  function isLibScope(id) { return LIB_KINDS.indexOf(id) >= 0; }
  function kindLabel(id) { return KIND_LABEL[id] || id || '资料'; }
  function kindFull(id) { return KIND_FULL[id] || id || '资料'; }

  function scopeCount(id) {
    if (id === 'all') {
      var n = D.policy ? D.policy.d.length : ((D.manifest && D.manifest.n) || 0);
      if (D.lib) return n + D.lib.d.length;
      var lc = (D.manifest && D.manifest.lib_counts) || [];
      for (var j = 0; j < lc.length; j++) n += lc[j].n;
      return n;
    }
    if (id === 'policy') return D.policy ? D.policy.d.length : 0;
    if (D.lib) return (D.lib.byKind[id] || []).length;
    var lc = (D.manifest && D.manifest.lib_counts) || [];
    for (var i = 0; i < lc.length; i++) if (lc[i].kind === id) return lc[i].n;
    return 0;
  }

  function availDefault() {
    var s = state.filters.avail;
    return s.size === 2 && s.has('full') && s.has('link');
  }
  function usesAvail() { return state.scope !== 'policy'; }
  function hasAvailFilter() { return usesAvail() && !availDefault(); }

  /** 当前视图对应的数据快照日：政策看源站最新发布日，知识库看栏目内最新条目。 */
  function scopeSnapshot() {
    var m = (D.policy && D.policy.m) || {};
    var pd = m.source_maxd || m.maxd || '';
    if (state.scope === 'policy') return pd || '—';
    var km = D.libKindMax();
    if (state.scope !== 'all') return km[state.scope] || pd || '—';
    var best = pd;
    Object.keys(km).forEach(function (k) { if (km[k] > best) best = km[k]; });
    return best || '—';
  }

  function buildDock() {
    clear(dom.dockScroll);
    SCOPES.forEach(function (sc) {
      var n = scopeCount(sc.id);
      var btn = h('button', {
        class: 'dock-tab', role: 'tab',
        'aria-selected': sc.id === state.scope ? 'true' : 'false',
        dataset: { scope: sc.id },
        onclick: function () { setScope(sc.id); }
      }, [h('span', { text: sc.label }), h('em', { text: n ? U.fmt(n) : '—' })]);
      dom.dockScroll.appendChild(btn);
    });
    renderDockTools();
  }

  function chip(label, on, count, onClick, iconPath) {
    var ico = iconPath ? svgIcon(iconPath, 13) : null;
    if (ico) ico.setAttribute('class', 'chip-ico');
    return h('button', {
      class: 'chip-btn', dataset: { on: on ? '1' : '0' }, onclick: onClick,
      title: label, 'aria-label': label + (on ? '，已启用' : '')
    }, [
      ico,
      h('span', { class: 'lbl', text: label }),
      count ? h('span', { class: 'cnt', text: count }) : null,
      on ? h('span', { class: 'x', text: '×' }) : null
    ]);
  }

  var FACET_ICON = {
    tax: 'M7 4h10v16l-2-1.4-2 1.4-2-1.4L9 20l-2-1.4zM9 8h6M9 12h5',
    region: 'M12 21s6-5.2 6-11a6 6 0 10-12 0c0 5.8 6 11 6 11zM12 10h.01',
    status: 'M12 3l7 3v5c0 4.5-3 8-7 10-4-2-7-5.5-7-10V6zM9 12l2 2 4-4',
    kind: 'M4 5h7v6H4zM13 5h7v6h-7zM4 13h7v6H4zM13 13h7v6h-7z',
    avail: 'M4 6h16M4 12h10M4 18h7M17 14l3 2.2-3 2.2z'
  };

  /** 当前条件下各可读性档位的条数（用于 chip 文案与浮层计数）。 */
  function availCounts() {
    var items = D.dataset(state.scope) || [];
    var f = state.filters, map = { full: 0, link: 0, index: 0 };
    for (var i = 0; i < items.length; i++) {
      var it = items[i];
      if (state.favOnly && !favSet.has(it.id)) continue;
      if (f.kind.size && !f.kind.has(it.k)) continue;
      if (f.year.size && !f.year.has(it.y)) continue;
      map[it.av] = (map[it.av] || 0) + 1;
    }
    return map;
  }

  function availLabel() {
    if (availDefault()) {
      var c = availCounts();
      return '可读 ' + U.fmt(c.full + c.link);
    }
    var s = state.filters.avail;
    if (!s.size) return '全部条目';
    if (s.size === 1) return AVAIL_LABEL[s.values().next().value] || '可读性';
    return '可读 + 仅索引';
  }

  /** 当前条目分布：跨栏视图要在结果头交代政策 / 问答 / 知识库各占多少。 */
  function kindDist(items) {
    var map = Object.create(null);
    for (var i = 0; i < items.length; i++) map[items[i].k] = (map[items[i].k] || 0) + 1;
    return map;
  }

  function readableCount(items) {
    var n = 0;
    for (var i = 0; i < items.length; i++) if (items[i].av !== 'index') n++;
    return n;
  }

  /** 当前作用域真正生效的筛选。政策单栏没有「类型 / 可读性」两个维度，
      若把默认的可读性筛选也套上去，会把只有索引的政策条目全部误排除。 */
  function effectiveFilters() {
    var f = state.filters;
    if (state.scope === 'policy') {
      return {
        tax: f.tax, year: f.year, region: f.region, status: f.status,
        kind: new Set(), avail: new Set()
      };
    }
    return {
      tax: f.tax, year: f.year, region: f.region, status: f.status,
      kind: f.kind, avail: f.avail
    };
  }

  function yearChipText() {
    var picked = Array.from(state.filters.year).sort().reverse();
    if (!picked.length) return '全部年份';
    if (picked.length === 1) return picked[0] + ' 年';
    return picked[picked.length - 1] + '–' + picked[0] + ' · ' + picked.length + ' 个';
  }

  /* 悬停提示里交代具体选了哪几年，避免 chip 折叠成区间后看不出明细 */
  function yearChipTitle() {
    var picked = Array.from(state.filters.year).sort().reverse();
    if (!picked.length) return '按年份筛选（可多选）';
    return '已选 ' + picked.length + ' 个年份：' +
      picked.slice(0, 6).join('、') + (picked.length > 6 ? ' 等' : '');
  }

  function renderDockTools() {
    var tools = dom.dockTools;
    clear(tools);
    var kinds = state.scope === 'policy' ? ['tax', 'year', 'region', 'status']
      : state.scope === 'all' ? ['kind', 'year', 'avail'] : ['year', 'avail'];
    kinds.forEach(function (kind) {
      if (kind === 'year') {
        tools.appendChild(h('button', {
          class: 'chip-btn',
          dataset: { on: state.filters.year.size ? '1' : '0', kind: 'year' },
          title: yearChipTitle(),
          'aria-haspopup': 'dialog',
          'aria-expanded': state.yearPanelOpen ? 'true' : 'false',
          onclick: function (e) { openFacet('year', e.currentTarget); }
        }, [
          h('span', { class: 'lbl', text: yearChipText() }),
          h('span', { class: 'caret', text: '▾' })
        ]));
        return;
      }
      if (kind === 'kind') {
        tools.appendChild(chip(
          state.filters.kind.size ? '类型 ' + state.filters.kind.size : '类型',
          state.filters.kind.size > 0, '',
          function (e) { openFacet('kind', e.currentTarget); },
          FACET_ICON.kind
        ));
        return;
      }
      if (kind === 'avail') {
        tools.appendChild(chip(
          availLabel(), hasAvailFilter(), '',
          function (e) { openFacet('avail', e.currentTarget); },
          FACET_ICON.avail
        ));
        return;
      }
      var set = state.filters[kind];
      tools.appendChild(chip(
        kind === 'tax' ? '税种' : kind === 'region' ? '地区' : '效力',
        set.size > 0, set.size || '',
        function (e) { openFacet(kind, e.currentTarget); },
        FACET_ICON[kind]
      ));
    });
    tools.appendChild(chip('收藏', state.favOnly, '', function () {
      state.favOnly = !state.favOnly;
      renderDockTools();
      renderContext();
      refresh();
    }, 'M12 3.8l2.5 5.1 5.6.8-4 3.9.9 5.6-5-2.6-5 2.6.9-5.6-4-3.9 5.6-.8z'));
    if (hasFilters()) {
      tools.appendChild(h('button', {
        class: 'chip-btn', title: '清空全部筛选',
        onclick: function () { resetFilters(); }
      }, [h('span', { text: '清空' })]));
    }
  }

  function hasFilters() {
    return !!(state.filters.tax.size || state.filters.year.size ||
      state.filters.region.size || state.filters.status.size ||
      state.filters.kind.size || hasAvailFilter() || state.favOnly);
  }

  function resetFilters() {
    state.filters.tax.clear();
    state.filters.year.clear();
    state.filters.region.clear();
    state.filters.status.clear();
    state.filters.kind.clear();
    state.filters.avail.clear();
    if (usesAvail()) { state.filters.avail.add('full'); state.filters.avail.add('link'); }
    state.favOnly = false;
    renderDockTools();
    renderContext();
    refresh();
  }

  /* ---------------- 筛选浮层 ---------------- */

  var popEl = null;

  function closePop() {
    if (popEl) { popEl.remove(); popEl = null; }
    state.yearPanelOpen = false;
    var t = dom.dockTools && dom.dockTools.querySelector('.chip-btn[data-kind="year"]');
    if (t) { t.setAttribute('aria-expanded', 'false'); t.dataset.open = '0'; }
    document.removeEventListener('mousedown', onDocDown, true);
    document.removeEventListener('keydown', onPopKey, true);
  }

  function onDocDown(e) {
    if (!popEl || popEl.contains(e.target)) return;
    if (state.yearPanelOpen && e.target.closest && e.target.closest('.chip-btn[data-kind="year"]')) return;
    closePop();
  }

  function onPopKey(e) { if (e.key === 'Escape') { closePop(); e.stopPropagation(); } }

  function facetOptions(kind) {
    var m = D.policy ? D.policy.m : {};
    var f = (m && m.facets) || {};
    var list = [];
    if (kind === 'tax') list = f.tax || [];
    else if (kind === 'region') list = f.regions || [];
    else if (kind === 'year') list = f.years || [];
    else if (kind === 'status') list = f.status || [];
    else if (kind === 'kind') {
      list = [['policy', D.policy ? D.policy.d.length : ((D.manifest && D.manifest.n) || 0)]];
      if (D.lib) {
        LIB_KINDS.forEach(function (k) { list.push([k, (D.lib.byKind[k] || []).length]); });
      } else {
        ((D.manifest && D.manifest.lib_counts) || []).forEach(function (c) { list.push([c.kind, c.n]); });
      }
    } else if (kind === 'avail') {
      var c = availCounts();
      list = [['full', c.full], ['link', c.link], ['index', c.index]];
    }
    if (kind === 'status' && !list.length) {
      list = [['全文有效', 0], ['部分失效', 0], ['全文失效', 0], ['未标注', 0]];
    }
    if (kind === 'year' && state.scope !== 'policy') {
      list = libYearFacet();
    }
    var arr = list.map(function (p) { return { v: String(p[0]), n: p[1] }; });
    if (kind === 'year') arr.sort(function (a, b) { return b.v.localeCompare(a.v); });
    else if (kind === 'avail') { /* 固定 全文 → 原文 → 仅索引 的语义顺序 */ }
    else arr.sort(function (a, b) { return b.n - a.n; });
    return arr;
  }

  function libYearFacet() {
    var items = D.dataset(state.scope), map = Object.create(null);
    for (var i = 0; i < items.length; i++) {
      var m = /(\d{4})年/.exec(items[i].d || '') || /^(\d{4})/.exec(items[i].d || '');
      if (m) map[m[1]] = (map[m[1]] || 0) + 1;
    }
    return Object.keys(map).map(function (y) { return [y, map[y]]; });
  }

  function openFacet(kind, anchor) {
    if (kind === 'year') {
      if (state.yearPanelOpen) { closePop(); return; }
      openYearFacet(anchor); return;
    }
    closePop();
    var selected = kind === 'tax' ? state.filters.tax : kind === 'year' ? state.filters.year
      : kind === 'region' ? state.filters.region : kind === 'kind' ? state.filters.kind
      : kind === 'avail' ? state.filters.avail : state.filters.status;
    var opts = facetOptions(kind);
    var q = '';

    var listBox = h('div', { class: 'pop-list' });
    var pop = h('div', { class: 'pop', role: 'dialog' }, [
      h('div', { class: 'pop-hd' }, [
        h('b', { text: kind === 'tax' ? '按税种筛选' : kind === 'year' ? '按年份筛选' :
          kind === 'region' ? '按地区筛选' : kind === 'kind' ? '按内容类型筛选' :
          kind === 'avail' ? '按可读性筛选' : '按效力筛选' }),
        h('span', { class: 'sp' }),
        h('button', { class: 'pop-x', onclick: closePop, 'aria-label': '关闭' }, '×')
      ]),
      opts.length > 8 ? h('input', {
        class: 'pop-search', placeholder: '过滤选项…',
        oninput: function (e) { q = U.norm(e.target.value); render(); }
      }) : null,
      listBox,
      h('div', { class: 'pop-ft' }, [
        h('button', {
          class: 'btn', text: '清空',
          onclick: function () {
            selected.clear();
            // 可读性没有「空集」语义：空集会把仅索引条目也放出来，与「清空」预期不符
            if (kind === 'avail') { selected.add('full'); selected.add('link'); }
            render(); commit();
          }
        }),
        h('button', { class: 'btn primary', text: '完成', onclick: function () { closePop(); } })
      ])
    ]);

    function commit() {
      renderDockTools();
      renderContext();
      refresh();
    }

    function render() {
      clear(listBox);
      var shown = 0;
      opts.forEach(function (o) {
        if (q && U.norm(o.v).indexOf(q) < 0) return;
        shown++;
        var on = selected.has(o.v);
        var label = kind === 'kind' ? kindFull(o.v) : kind === 'avail' ? AVAIL_LABEL[o.v] : o.v;
        listBox.appendChild(h('label', { class: 'pop-item', dataset: { on: on ? '1' : '0' } }, [
          h('input', {
            type: 'checkbox', checked: on ? 'checked' : null,
            onchange: function (e) {
              if (e.target.checked) selected.add(o.v); else selected.delete(o.v);
              commit();
            }
          }),
          h('span', { class: 'v', text: label || o.v }),
          h('em', { text: o.n ? U.fmt(o.n) : '' })
        ]));
      });
      if (!shown) listBox.appendChild(h('div', { class: 'pop-none', text: '没有匹配的选项' }));
    }

    render();
    document.body.appendChild(pop);
    popEl = pop;

    var r = anchor.getBoundingClientRect();
    pop.style.top = Math.round(r.bottom + 8) + 'px';
    var left = Math.round(r.left);
    pop.style.left = Math.max(10, Math.min(left, window.innerWidth - pop.offsetWidth - 10)) + 'px';

    setTimeout(function () {
      document.addEventListener('mousedown', onDocDown, true);
      document.addEventListener('keydown', onPopKey, true);
    }, 0);
  }

  /* ---------------- 年份增强下拉 ---------------- */

  function yearCounts() {
    var items = D.dataset(state.scope) || [];
    var f = state.filters, map = Object.create(null);
    for (var i = 0; i < items.length; i++) {
      var it = items[i];
      if (state.favOnly && !favSet.has(it.id)) continue;
      if (f.tax.size && !f.tax.has(it.x) && !f.tax.has(it.c)) continue;
      if (f.region.size && !f.region.has(it.p)) continue;
      if (f.status.size && !f.status.has(it.w)) continue;
      var y = it.y || String(it.d || '').slice(0, 4);
      if (y) map[y] = (map[y] || 0) + 1;
    }
    return map;
  }

  function syncYearTrigger() {
    var btn = dom.dockTools.querySelector('.chip-btn[data-kind="year"]');
    if (!btn) return;
    btn.querySelector('.lbl').textContent = yearChipText();
    btn.dataset.on = state.filters.year.size ? '1' : '0';
  }

  function openYearFacet(anchor) {
    closePop();
    var sel = state.filters.year;
    var counts = yearCounts();
    var years = Object.keys(counts).sort().reverse();
    Array.from(sel).forEach(function (y) { if (years.indexOf(y) < 0) years.push(y); });
    years.sort(function (a, b) { return b.localeCompare(a); });
    var max = 1;
    years.forEach(function (y) { if ((counts[y] || 0) > max) max = counts[y]; });

    var latest = years.length ? parseInt(years[0], 10) : new Date().getFullYear();
    var oldest = years.length ? parseInt(years[years.length - 1], 10) : latest;
    var axis = [];
    for (var yy = latest; yy >= oldest && axis.length < 160; yy--) axis.push(String(yy));

    var q = '';
    var active = -1;

    var sparkBox = h('div', { class: 'yrp-spark', role: 'group', 'aria-label': '年份收录量时间轴，点击柱可勾选年份' });
    var axisRow = h('div', { class: 'yrp-axis' }, [
      h('span', { text: oldest + ' 年' }),
      h('span', { class: 'sp', text: '收录量分布' }),
      h('span', { text: latest + ' 年' })
    ]);
    var quickBox = h('div', { class: 'yrp-quick', role: 'group', 'aria-label': '年份快捷区间' });
    var listBox = h('div', { class: 'yrp-list', role: 'listbox', 'aria-multiselectable': 'true' });
    var info = h('span', { class: 'info' });
    var allToggle = h('label', { class: 'yrp-toggle' }, [
      h('input', {
        type: 'checkbox', checked: state.yearAll ? 'checked' : null,
        onchange: function (e) {
          state.yearAll = !!e.target.checked;
          App.store.set('tsq3.yearAll', state.yearAll);
          renderRows();
          syncPanel();
        }
      }),
      h('span', { text: '显示无数据年份' })
    ]);

    var pop = h('div', { class: 'pop yrpop', role: 'dialog', 'aria-label': '按年份筛选' }, [
      h('div', { class: 'yrp-hd' }, [
        h('b', { text: '按年份筛选' }),
        h('span', { class: 'sp' }),
        h('em', { text: years.length + ' 个年份 · 可多选' }),
        h('button', { class: 'pop-x', text: '×', 'aria-label': '关闭', onclick: closePop })
      ]),
      sparkBox,
      axisRow,
      h('div', { class: 'yrp-tools' }, [
        quickBox,
        h('input', {
          class: 'pop-search', type: 'text', placeholder: '输入年份，如 2024…',
          style: 'margin:0;width:100%',
          oninput: function (e) { q = U.norm(e.target.value); active = -1; renderRows(); syncPanel(); }
        })
      ]),
      listBox,
      h('div', { class: 'yrp-sub' }, [allToggle]),
      h('div', { class: 'yrp-ft' }, [
        info,
        h('button', { class: 'btn', text: '清空', onclick: function () { applyQuick(0); } }),
        h('button', { class: 'btn primary', text: '完成', onclick: closePop })
      ])
    ]);

    /* 时间轴：一年一柱，高度按开方压缩，避免 2026 的 3 千余条把小年份压成一条线 */
    axis.slice().reverse().forEach(function (y) {
      var n = counts[y] || 0;
      var hh = n ? Math.max(4, Math.round(3 + 30 * Math.sqrt(n / max))) : 2;
      sparkBox.appendChild(h('button', {
        class: 'yc', type: 'button', tabindex: '-1',
        dataset: { y: y, on: sel.has(y) ? '1' : '0', zero: n ? '0' : '1' },
        style: 'height:' + hh + 'px',
        title: y + ' 年 · ' + U.fmt(n) + ' 条' + (n ? '' : '（无数据）'),
        onclick: function () { toggleYear(y); }
      }));
    });

    function rowEls() {
      return Array.prototype.slice.call(listBox.querySelectorAll('.yrp-row'));
    }

    function setActive(i) {
      var rows = rowEls();
      if (!rows.length) return;
      active = Math.max(0, Math.min(rows.length - 1, i));
      rows.forEach(function (r, k) { r.dataset.active = k === active ? '1' : '0'; });
      var cb = rows[active].querySelector('input');
      if (cb) cb.focus();
      if (rows[active].scrollIntoView) rows[active].scrollIntoView({ block: 'nearest' });
    }

    function commit() {
      syncYearTrigger();
      renderContext();
      refresh().then(function () { if (popEl === pop) syncPanel(); });
    }

    function persistSpan() { App.store.set('tsq3.yearSpan', state.yearSpan); }

    function applyQuick(n) {
      sel.clear();
      if (n) {
        var from = latest - n + 1;
        axis.forEach(function (y) {
          if (parseInt(y, 10) >= from && counts[y]) sel.add(y);
        });
        if (!sel.size) years.slice(0, n).forEach(function (y) { sel.add(y); });
      }
      state.yearSpan = n ? String(n) : 'all';
      persistSpan();
      renderRows();
      syncPanel();
      commit();
    }

    function toggleYear(y) {
      if (sel.has(y)) sel.delete(y); else sel.add(y);
      state.yearSpan = 'all';
      persistSpan();
      if (!state.yearAll && !(counts[y] || 0)) renderRows();
      syncPanel();
      commit();
    }

    function visibleYears() {
      var base = [];
      axis.forEach(function (y) {
        if (!state.yearAll && !(counts[y] || 0) && !sel.has(y)) return;
        base.push(y);
      });
      Array.from(sel).forEach(function (y) { if (base.indexOf(y) < 0) base.push(y); });
      base.sort(function (a, b) { return b.localeCompare(a); });
      return base;
    }

    function renderRows() {
      clear(listBox);
      var total = (D.dataset(state.scope) || []).length || 1;
      var shown = 0;
      visibleYears().forEach(function (y) {
        if (q && y.indexOf(q) < 0) return;
        shown++;
        var n = counts[y] || 0;
        var w = n ? Math.max(2, Math.round((n / max) * 100)) : 0;
        listBox.appendChild(h('label', {
          class: 'yrp-row', dataset: { on: sel.has(y) ? '1' : '0', y: y, zero: n ? '0' : '1' },
          title: y + ' 年 · 当前条件下 ' + U.fmt(n) + ' 条' +
            (n ? ' · 占全库 ' + (Math.round((n / total) * 1000) / 10) + '%' : ''),
          onclick: function (e) { if (e.target.tagName !== 'INPUT') active = -1; }
        }, [
          h('input', {
            type: 'checkbox', checked: sel.has(y) ? 'checked' : null,
            onchange: function () { toggleYear(y); }
          }),
          h('span', { class: 'yrp-y', text: y }),
          h('span', { class: 'yrp-bar' }, [h('i', { style: 'width:' + w + '%' })]),
          h('span', { class: 'yrp-n', text: U.fmt(n) })
        ]));
      });
      if (!shown) listBox.appendChild(h('div', { class: 'pop-none', text: '没有匹配的年份' }));
    }

    function syncPanel() {
      Array.prototype.forEach.call(listBox.querySelectorAll('.yrp-row'), function (row) {
        var on = sel.has(row.dataset.y) ? '1' : '0';
        row.dataset.on = on;
        var cb = row.querySelector('input');
        if (cb) cb.checked = on === '1';
      });
      Array.prototype.forEach.call(sparkBox.querySelectorAll('.yc'), function (b) {
        b.dataset.on = sel.has(b.dataset.y) ? '1' : '0';
      });
      Array.prototype.forEach.call(quickBox.querySelectorAll('button'), function (b) {
        b.setAttribute('aria-pressed', b.dataset.n === state.yearSpan ? 'true' : 'false');
      });
      var picked = Array.from(sel);
      var hit = picked.length
        ? picked.reduce(function (a, y) { return a + (counts[y] || 0); }, 0)
        : (D.dataset(state.scope) || []).length;
      info.textContent = (picked.length ? '已选 ' + picked.length + ' 年' : '全部年份') +
        ' · 可选 ' + U.fmt(hit) + ' 条';
    }

    [['all', '全部'], ['1', '近 1 年'], ['3', '近 3 年'], ['5', '近 5 年'], ['10', '近 10 年']]
      .forEach(function (p) {
        quickBox.appendChild(h('button', {
          dataset: { n: p[0] }, text: p[1],
          title: p[0] === 'all' ? '不按年份筛选' : '取最近 ' + p[0] + ' 个自然年（以库内最新年份 ' + latest + ' 为基准）',
          onclick: function () { applyQuick(p[0] === 'all' ? 0 : parseInt(p[0], 10)); }
        }));
      });

    renderRows();
    syncPanel();

    document.body.appendChild(pop);
    popEl = pop;
    state.yearPanelOpen = true;
    anchor.setAttribute('aria-expanded', 'true');
    anchor.dataset.open = '1';

    var r = anchor.getBoundingClientRect();
    pop.style.top = Math.round(r.bottom + 8) + 'px';
    pop.style.left = Math.max(10, Math.min(Math.round(r.right - pop.offsetWidth), window.innerWidth - pop.offsetWidth - 10)) + 'px';

    pop.addEventListener('keydown', function (e) {
      if (e.key === 'ArrowDown' || e.key === 'ArrowUp') {
        e.preventDefault();
        if (active < 0) { setActive(0); return; }
        setActive(active + (e.key === 'ArrowDown' ? 1 : -1));
      } else if (e.key === 'Enter' && e.target.tagName === 'INPUT' && e.target.type === 'checkbox') {
        e.preventDefault();
        closePop();
      }
    });

    setTimeout(function () {
      document.addEventListener('mousedown', onDocDown, true);
      document.addEventListener('keydown', onPopKey, true);
      var first = pop.querySelector('.pop-search');
      if (first && window.innerWidth > 720) first.focus();
    }, 0);
  }

  /* ---------------- 上下文说明行 ---------------- */

  function renderContext() {
    var box = dom.contextLine;
    if (!box) return;
    clear(box);
    var sc = SCOPES.filter(function (s) { return s.id === state.scope; })[0] || SCOPES[0];
    var st = dataStatus();
    var ds = D.dataset(state.scope) || [];
    var phase = S.phase;
    var kind = 'ok', badge = '数据就绪', note = st.head + ' · ' + st.sub;
    if (!D.policy && !D.lib) {
      kind = 'busy'; badge = '载入中'; note = '首次打开需下载数据包，之后走本地缓存';
    } else if (state.libLoading) {
      kind = 'busy'; badge = '载入知识库'; note = '知识库按需载入中，先显示已就绪的内容';
    } else if (phase === 'error' || st.bad) {
      kind = 'err'; badge = '需要核对'; note = '同步异常或数据滞后，建议立即检查更新';
    } else if (phase === 'updating' || phase === 'checking') {
      kind = 'busy'; badge = '同步中'; note = '正在检查或同步最新数据';
    } else if (!ds.length) {
      kind = 'warn'; badge = '暂无数据'; note = '该内容体系尚未载入，可切换栏目或同步一次';
    } else if (st.kind === 'warn') {
      kind = 'warn'; badge = '略有滞后';
    }

    var sourceTxt = state.scope === 'policy' ? '税务总局政策法规库'
      : state.scope === 'all' ? '政策法规库 + 税务官方公开资料' : '税务官方公开资料';
    var countTxt;
    if (state.scope === 'all' && !D.lib) {
      countTxt = '合计约 ' + U.fmt(scopeCount('all')) + ' 条（知识库按需载入）';
    } else {
      countTxt = '当前视图 ' + U.fmt(ds.length) + ' 条';
    }

    box.appendChild(h('span', { class: 'ctx-badge', dataset: { kind: kind }, text: badge }));
    box.appendChild(h('span', { class: 'ctx-main' }, [
      h('b', { text: sc.label }),
      document.createTextNode(' · 数据来源：' + sourceTxt +
        ' · 快照 ' + scopeSnapshot() + ' · ' + countTxt + ' · ' + note)
    ]));
    box.appendChild(h('button', {
      class: 'ctx-act', text: kind === 'err' ? '立即重试' : '同步详情',
      onclick: function () {
        if (kind === 'err') S.check(true).then(function (ch) { if (!ch) toast('已是最新版本'); });
        else dom.syncPill.click();
      }
    }));
  }

  /* ---------------- 数据范围切换 ---------------- */

  function setScope(id) {
    if (state.scope === id) return;
    var sc = SCOPES.filter(function (s) { return s.id === id; })[0];
    if (!sc) return;
    state.scope = id;
    state.q = '';
    state.sort = 'date';
    dom.input.value = '';
    state.selId = '';
    state.filters.tax.clear();
    state.filters.year.clear();
    state.filters.region.clear();
    state.filters.status.clear();
    state.filters.kind.clear();
    state.filters.avail.clear();
    if (usesAvail()) {
      state.filters.avail.add('full');
      state.filters.avail.add('link');
    }
    buildDock();
    setStatus(id === 'all' ? '载入全部内容…' : '载入「' + sc.label + '」…', 'busy');

    var ready;
    if (id === 'policy') {
      ready = Promise.resolve();
    } else {
      state.libLoading = !D.lib;
      if (state.libLoading) renderContext();
      ready = S.loadLib().then(function () {
        state.libLoading = false;
      }, function (e) {
        state.libLoading = false;
        toast('知识库载入失败：' + e.message, 'err');
        throw e;
      });
    }

    return ready.then(function () {
      buildDock();
      renderContext();
      return refresh();
    }).then(function () {
      dom.vlist.scrollTop = 0;
      renderReader();
      if (window.innerWidth <= 1180) closeReader();
    }).catch(function (e) {
      setStatus('「' + sc.label + '」载入失败：' + (e.message || e), 'err');
    });
  }

  /* ---------------- 检索与渲染 ---------------- */

  function ensureIndex() {
    // 进入知识库 / 全部栏目时数据可能尚未下载：先补载，避免用空集建出一份「全部」索引
    if (state.scope !== 'policy' && !D.lib) {
      return S.loadLib().catch(function (e) {
        toast('知识库载入失败：' + e.message, 'err');
        throw e;
      }).then(function () {
        if (!D.lib) return;
        return ensureIndex();
      });
    }
    var scope = state.scope;
    var items = D.dataset(scope);
    // 索引可能因数据更新被打断而丢弃，不能只信 UI 上的 ready 标记
    if (state.indexReady[scope] && Q.isReady(scope, items)) return Promise.resolve();
    if (!items.length) return Promise.resolve();
    setStatus('建立' + (scope === 'all' ? '全库' : '栏目') + '索引 ' + U.fmt(items.length) + ' 条…', 'busy');
    return Q.ensure(scope, items, function (p) {
      dom.stMid.textContent = '建立索引 ' + Math.round(p * 100) + '%';
    }).then(function () {
      state.indexReady[scope] = Q.isReady(scope, items);
    });
  }

  /* 「全部」要下载知识库并建 9.5 万条索引。桌面端空闲时预热，移动端等首次搜索再建，
     弱网 / 省流量 / 低内存设备一律不预热。 */
  function schedulePrewarm() {
    if (state.prewarm) return;
    state.prewarm = true;
    if (window.innerWidth < 1180) return;
    var c = navigator.connection || {};
    if (c.saveData || /(^|-)2g$/.test(c.effectiveType || '')) return;
    if (navigator.deviceMemory && navigator.deviceMemory < 4) return;
    var run = function () {
      if (D.lib || state.scope !== 'policy') return;
      S.loadLib().then(function () {
        var items = D.dataset('all');
        if (!items.length || Q.isReady('all', items)) {
          state.indexReady.all = Q.isReady('all', items);
          return;
        }
        return Q.ensure('all', items).then(function () {
          state.indexReady.all = Q.isReady('all', items);
        });
      }).catch(function () { /* 预热失败不影响正常使用 */ });
    };
    if (window.requestIdleCallback) window.requestIdleCallback(run, { timeout: 8000 });
    else setTimeout(run, 6000);
  }

  function refresh() {
    var seq = ++state.seq;
    return ensureIndex().then(function () {
      if (seq !== state.seq) return;
      var res = Q.run(state.scope, state.q, {
        filters: effectiveFilters(),
        favOnly: state.favOnly,
        ids: state.favOnly ? setToMap(favSet) : null,
        titleOnly: state.titleOnly,
        demoteDead: state.scope === 'all',
        sort: state.sort === 'auto' ? (state.q ? 'rel' : 'date') : state.sort
      });
      if (seq !== state.seq) return;
      state.results = res.items;
      state.resMeta = res;
      renderHead(res);
      renderContext();
      renderList();
      syncSelection();
      setStatus('就绪', '');
      dom.stMid.textContent = res.browse
        ? '浏览模式 · ' + U.fmt(res.items.length) + ' 条'
        : '检索 ' + U.fmt(res.items.length) + ' 条 · ' + res.ms + 'ms';
    }).catch(function (e) {
      setStatus('检索失败：' + e.message, 'err');
    });
  }

  function setToMap(set) {
    var m = Object.create(null);
    set.forEach(function (k) { m[k] = 1; });
    return m;
  }

  function renderHead(res) {
    var total = res.total || (D.dataset(state.scope).length);
    var shown = res.items.length;
    clear(dom.resLine);
    dom.resLine.appendChild(h('span', { class: 'hit' }, [
      h('b', { text: U.fmt(shown) }),
      document.createTextNode((res.browse ? ' 条' : ' 条命中') +
        (shown !== total ? ' / 共 ' + U.fmt(total) : ''))
    ]));
    // 跨栏视图先交代结果来源，避免把问答当政策、把索引当全文
    if (state.scope === 'all' && shown) {
      var dist = kindDist(res.items), parts = [];
      KIND_ORDER.forEach(function (k) {
        if (dist[k]) parts.push(kindLabel(k) + ' ' + U.fmt(dist[k]));
      });
      if (parts.length) {
        dom.resLine.appendChild(h('span', {
          class: 'dist', title: '本次结果的内容来源分布', text: parts.join(' · ')
        }));
      }
    }
    state.filters.kind.forEach(function (v) {
      dom.resLine.appendChild(h('span', { class: 'tag' }, [
        h('span', { text: '类型：' + kindFull(v) }),
        h('button', {
          text: '×', title: '移除该条件', 'aria-label': '移除类型 ' + kindFull(v),
          onclick: function () {
            state.filters.kind.delete(v);
            renderDockTools(); renderContext(); refresh();
          }
        })
      ]));
    });
    if (hasAvailFilter()) {
      var av = state.filters.avail;
      var avTxt = av.size === 1 ? (AVAIL_LABEL[av.values().next().value] || '可读性')
        : av.size >= 3 ? '全部条目' : '可读 + 仅索引';
      dom.resLine.appendChild(h('span', { class: 'tag' }, [
        h('span', { text: '可读性：' + avTxt }),
        h('button', {
          text: '×', title: '恢复默认（全文 + 原文）', 'aria-label': '恢复默认可读性筛选',
          onclick: function () {
            state.filters.avail.clear();
            state.filters.avail.add('full'); state.filters.avail.add('link');
            renderDockTools(); renderContext(); refresh();
          }
        })
      ]));
    }
    [['year', '年份'], ['tax', '税种'], ['region', '地区'], ['status', '效力']].forEach(function (g) {
      state.filters[g[0]].forEach(function (v) {
        dom.resLine.appendChild(h('span', { class: 'tag' }, [
          h('span', { text: g[1] + '：' + v + (g[0] === 'year' ? ' 年' : '') }),
          h('button', {
            text: '×', title: '移除该条件', 'aria-label': '移除 ' + g[1] + ' ' + v,
            onclick: function () {
              state.filters[g[0]].delete(v);
              renderDockTools(); renderContext(); refresh();
            }
          })
        ]));
      });
    });
    if (state.favOnly) {
      dom.resLine.appendChild(h('span', { class: 'tag' }, [
        h('span', { text: '已收藏' }),
        h('button', {
          text: '×', title: '取消只看收藏',
          onclick: function () { state.favOnly = false; renderDockTools(); renderContext(); refresh(); }
        })
      ]));
    }
    if (hasFilters() || state.q.trim()) {
      dom.resLine.appendChild(h('button', {
        class: 'clear', text: '清空条件',
        onclick: function () {
          resetFilters();
          state.q = ''; dom.input.value = '';
          renderContext(); refresh();
        }
      }));
    }
    dom.resLine.appendChild(h('span', { class: 'sp' }));
    if (state.q.trim()) {
      dom.resLine.appendChild(h('span', {
        class: 'mode',
        text: state.titleOnly ? '仅标题/文号 · 命中词已高亮' : '命中词已高亮 · 多词同时包含'
      }));
    }
    var sortTxt = state.sort === 'auto'
      ? (state.q ? '智能排序 · 相关度' : '智能排序 · 最新')
      : state.sort === 'rel' ? '相关度优先' : '最新在前';
    dom.sortLabel.textContent = sortTxt;
    dom.sortBtn.title = '当前：' + sortTxt + '；点击切换（智能 / 相关度 / 最新）';
    dom.favBtn.dataset.on = state.favOnly ? '1' : '0';
    if (dom.titleBtn) {
      dom.titleBtn.dataset.on = state.titleOnly ? '1' : '0';
      dom.titleBtn.setAttribute('aria-pressed', state.titleOnly ? 'true' : 'false');
    }
  }

  /* ---------------- 虚拟列表 ---------------- */

  var ROW_H = 74;
  var pool = new Map();
  var rafPending = false;

  function readRowHeight() {
    var v = getComputedStyle(document.documentElement).getPropertyValue('--row-h');
    ROW_H = parseFloat(v) || 74;
  }

  function dateKey(d) {
    var m = /(\d{4})\D+(\d{1,2})\D+(\d{1,2})/.exec(d || '');
    return m ? m[1] + '-' + ('0' + m[2]).slice(-2) + '-' + ('0' + m[3]).slice(-2) : '';
  }
  var newDateCut = '';

  function renderList() {
    pool.forEach(function (el) { el.remove(); });
    pool = new Map();
    var n = state.results.length;
    var cut = '';
    for (var ci = 0; ci < n; ci++) {
      var ck = dateKey(state.results[ci].d);
      if (ck && ck > cut) cut = ck;
    }
    newDateCut = cut;
    dom.vspacer.style.height = (n * ROW_H) + 'px';
    dom.vlist.scrollTop = Math.min(dom.vlist.scrollTop, Math.max(0, n * ROW_H - 10));
    paintWindow(true);

    var empty = !n;
    dom.listEmpty.hidden = !empty;
    if (empty) {
      clear(dom.listEmpty);
      var hasQ = !!state.q.trim();
      var hasF = hasFilters();
      var noData = !(D.dataset(state.scope) || []).length;
      var title, msg;
      if (!D.policy && !D.lib) {
        title = '正在载入政策库'; msg = '首次打开需下载数据包，之后走本地缓存，几乎秒开。';
      } else if (noData) {
        title = '本栏目尚未载入数据'; msg = '切换上方内容体系，或点击顶栏同步一次。';
      } else if (hasQ && hasF) {
        title = '没有同时满足条件的条文'; msg = '移除部分筛选条件，或换用更短的关键词（如「留抵退税」「小规模」）。';
      } else if (hasQ) {
        title = '没有匹配的条文'; msg = '试试更短的关键词，或清空筛选条件。';
      } else if (hasF) {
        title = '当前筛选下没有结果'; msg = '清空筛选条件即可恢复浏览全部条目。';
      } else {
        title = '这个范围内还没有数据'; msg = '切换上方内容体系，或点击右上角同步一次。';
      }
      // 默认只显示可读条目；若命中只落在「仅索引」条目上，给一键纳入而不是让用户以为没结果
      var indexElsewhere = 0;
      if (state.scope !== 'policy' && !state.filters.avail.has('index')) {
        try {
          var f2 = effectiveFilters();
          f2.avail = new Set(state.filters.avail);
          f2.avail.add('index');
          var alt = Q.run(state.scope, state.q, {
            filters: f2,
            favOnly: state.favOnly,
            ids: state.favOnly ? setToMap(favSet) : null,
            titleOnly: state.titleOnly,
            sort: state.sort === 'auto' ? (state.q ? 'rel' : 'date') : state.sort
          });
          indexElsewhere = alt.items.length;
        } catch (e) { indexElsewhere = 0; }
        if (indexElsewhere) {
          title = '可读条目里没有匹配';
          msg = '另有 ' + U.fmt(indexElsewhere) + ' 条只有索引的条目命中，可纳入查看标题、日期与检索入口。';
        }
      }
      dom.listEmpty.appendChild(h('b', { text: title }));
      dom.listEmpty.appendChild(h('p', { text: msg }));
      var acts = h('div', { class: 'empty-acts' });
      if (indexElsewhere) acts.appendChild(h('button', {
        class: 'mini-btn primary', text: '纳入仅索引（' + U.fmt(indexElsewhere) + ' 条）',
        onclick: function () {
          state.filters.avail.add('index');
          renderDockTools(); renderContext(); refresh();
        }
      }));
      if (hasF) acts.appendChild(h('button', {
        class: 'mini-btn', text: '清空筛选条件', onclick: function () { resetFilters(); }
      }));
      if (hasQ) acts.appendChild(h('button', {
        class: 'mini-btn', text: '清空关键词',
        onclick: function () { dom.input.value = ''; state.q = ''; refresh(); }
      }));
      if (hasQ && !D.clientSafe) acts.appendChild(h('button', {
        class: 'mini-btn', text: '用 AI 回答这个问题',
        onclick: function () { App.ai.open(state.q); }
      }));
      dom.listEmpty.appendChild(acts);
      if (!hasQ && !hasF && history.length) {
        var histBox = h('div', { class: 'hist' }, [h('span', { class: 'hist-lbl', text: '最近搜索' })]);
        history.slice(0, 8).forEach(function (t) {
          histBox.appendChild(h('button', {
            class: 'mini-btn', text: t, title: '再次搜索「' + t + '」',
            onclick: function () {
              dom.input.value = t; state.q = t; pushHistory(t); refresh();
            }
          }));
        });
        dom.listEmpty.appendChild(histBox);
      }
    }
  }

  function paintWindow(force) {
    var scrollTop = dom.vlist.scrollTop;
    var vh = dom.vlist.clientHeight || 600;
    var n = state.results.length;
    var start = Math.max(0, Math.floor(scrollTop / ROW_H) - 5);
    var end = Math.min(n, Math.ceil((scrollTop + vh) / ROW_H) + 5);

    pool.forEach(function (el, i) {
      if (i < start || i >= end) { el.remove(); pool.delete(i); }
    });
    for (var i = start; i < end; i++) {
      if (!pool.has(i)) {
        var el = buildRow(state.results[i], i);
        dom.vrows.appendChild(el);
        pool.set(i, el);
      }
    }
    pool.forEach(function (el, i) {
      el.style.transform = 'translateY(' + (i * ROW_H) + 'px)';
    });
  }

  function onScroll() {
    if (rafPending) return;
    rafPending = true;
    requestAnimationFrame(function () { rafPending = false; paintWindow(); });
  }

  function pushHistory(t) {
    t = String(t || '').trim();
    if (!t || t.length > 60) return;
    history = [t].concat(history.filter(function (x) { return x !== t; })).slice(0, 8);
    App.store.set('tsq3.hist', history);
  }

  /** 结果行摘要：围绕命中词取窗口，命中在正文深处时也能看见上下文。 */
  function snippetOf(it, q) {
    var raw = it.kk || it.q || it.s || '';
    if (!raw) return '';
    var text = String(raw).replace(/\s+/g, ' ').trim();
    if (text.length < 12) return '';
    var nq = U.norm(q || '');
    var start = 0;
    if (nq.length >= 2) {
      var toks = Q.tokens(nq).filter(function (t) { return t.length > 1; }).slice(0, 4);
      var low = text.toLowerCase();
      for (var i = 0; i < toks.length; i++) {
        var idx = low.indexOf(toks[i]);
        if (idx >= 0) { start = Math.max(0, idx - 24); break; }
      }
    }
    var out = text.slice(start, start + 96);
    if (start > 0) out = '…' + out;
    if (start + 96 < text.length) out += '…';
    return out;
  }

  function relDate(d) {
    var dd = U.daysBetween(d);
    if (dd == null || dd < 0) return '';
    if (dd === 0) return '今天';
    if (dd === 1) return '昨天';
    if (dd < 30) return dd + ' 天前';
    if (dd < 365) return Math.round(dd / 30) + ' 个月前';
    return Math.floor(dd / 365) + ' 年前';
  }

  function buildRow(it, i) {
    var isSel = it.id === state.selId;
    var el = h('div', {
      class: 'row', role: 'option', tabindex: '-1',
      'aria-selected': isSel ? 'true' : 'false',
      dataset: { i: i, id: it.id },
      onclick: function () { select(it.id, true); }
    });

    var title = h('div', { class: 'r-title' });
    appendHighlighted(title, it.t, state.q);
    if (newDateCut && dateKey(it.d) === newDateCut) {
      title.appendChild(h('span', { class: 'new-badge', text: 'NEW' }));
    }

    var meta = h('div', { class: 'r-meta' });
    if (state.scope === 'all') {
      meta.appendChild(h('span', {
        class: 'kind-badge k-' + it.k, text: kindLabel(it.k), title: kindFull(it.k)
      }));
    }
    if (it.n) meta.appendChild(h('span', { class: 'r-no', text: it.n }));
    if (it.c) meta.appendChild(h('span', { class: 'r-src', text: it.c }));
    if (it.av && it.av !== 'full') {
      meta.appendChild(h('span', {
        class: 'av-badge ' + it.av, text: AVAIL_LABEL[it.av] || it.av,
        title: it.av === 'index' ? '源站只提供简短摘要或标题，无正文与链接' : '未收录正文，可打开原文页面'
      }));
    }
    if (state.scope === 'policy') {
      if (it.o) meta.appendChild(h('span', { class: 'm', text: it.o }));
      if (it.p) { meta.appendChild(h('span', { class: 'sep', text: '·' })); meta.appendChild(h('span', { text: it.p })); }
      if (it.w) meta.appendChild(pill(it.w));
    } else {
      if (it.s) { meta.appendChild(h('span', { class: 'sep', text: '·' })); meta.appendChild(h('span', { text: it.s })); }
      if (it.src) { meta.appendChild(h('span', { class: 'sep', text: '·' })); meta.appendChild(h('span', { class: 'm', text: it.src })); }
    }

    var side = h('div', { class: 'r-side' }, [
      h('span', { class: 'r-date', text: it.d || '' })
    ]);
    var rd = relDate(it.d);
    if (rd) side.appendChild(h('span', { class: 'r-rel', text: rd }));
    if (it._r && !state.resMeta.browse) side.appendChild(relRing(it._r));

    var main = h('div', { class: 'r-main' }, [title, meta]);
    var snip = snippetOf(it, state.q);
    if (snip) {
      var snipEl = h('div', { class: 'r-snip' });
      appendHighlighted(snipEl, snip, state.q);
      main.appendChild(snipEl);
    }
    el.appendChild(main);
    el.appendChild(side);
    return el;
  }

  function relRing(r) {
    var C = 2 * Math.PI * 10;
    var ns = 'http://www.w3.org/2000/svg';
    var svg = document.createElementNS(ns, 'svg');
    svg.setAttribute('width', '26'); svg.setAttribute('height', '26');
    svg.setAttribute('viewBox', '0 0 26 26');
    var trk = document.createElementNS(ns, 'circle');
    trk.setAttribute('cx', '13'); trk.setAttribute('cy', '13'); trk.setAttribute('r', '10');
    trk.setAttribute('class', 'trk');
    var val = document.createElementNS(ns, 'circle');
    val.setAttribute('cx', '13'); val.setAttribute('cy', '13'); val.setAttribute('r', '10');
    val.setAttribute('class', 'val');
    val.setAttribute('stroke-dasharray', C.toFixed(1));
    val.setAttribute('stroke-dashoffset', (C * (1 - r)).toFixed(1));
    svg.appendChild(trk); svg.appendChild(val);
    // 环里补上数字：只有一圈红环时，读者会当成单选按钮而不是相关度
    return h('div', { class: 'rel', title: '相关度 ' + Math.round(r * 100) + '%' }, [
      svg,
      h('span', { text: String(Math.round(r * 100)) })
    ]);
  }

  function pill(status) {
    var cls = status === '全文有效' ? 'ok' : status === '部分失效' ? 'part'
      : status === '全文失效' ? 'dead' : 'na';
    return h('span', { class: 'pill ' + cls, text: status });
  }

  function appendHighlighted(parent, text, q) {
    var nq = U.norm(q || '');
    if (!nq || nq.length < 2) { parent.appendChild(document.createTextNode(text)); return; }
    var toks = Q.tokens(nq).filter(function (t) { return t.length > 1; })
      .sort(function (a, b) { return b.length - a.length; }).slice(0, 8);
    if (nq.length >= 2) toks.unshift(nq);

    var low = text.toLowerCase();
    var ranges = [];
    toks.forEach(function (t) {
      var from = 0, idx, guard = 0;
      while ((idx = low.indexOf(t, from)) >= 0 && guard++ < 20) {
        ranges.push([idx, idx + t.length]);
        from = idx + t.length;
      }
    });
    if (!ranges.length) { parent.appendChild(document.createTextNode(text)); return; }
    ranges.sort(function (a, b) { return a[0] - b[0]; });
    var merged = [ranges[0]];
    for (var i = 1; i < ranges.length; i++) {
      var last = merged[merged.length - 1];
      if (ranges[i][0] <= last[1]) last[1] = Math.max(last[1], ranges[i][1]);
      else merged.push(ranges[i]);
    }
    var pos = 0;
    merged.forEach(function (r) {
      if (r[0] > pos) parent.appendChild(document.createTextNode(text.slice(pos, r[0])));
      parent.appendChild(h('mark', { text: text.slice(r[0], r[1]) }));
      pos = r[1];
    });
    if (pos < text.length) parent.appendChild(document.createTextNode(text.slice(pos)));
  }

  /* ---------------- 选中与阅读窗 ---------------- */

  function findItem(id) {
    var items = D.dataset(state.scope);
    for (var i = 0; i < items.length; i++) if (items[i].id === id) return items[i];
    return null;
  }

  function currentItem() { return state.selId ? findItem(state.selId) : null; }

  function syncSelection() {
    pool.forEach(function (el, i) {
      var isSel = state.results[i] && state.results[i].id === state.selId;
      el.setAttribute('aria-selected', isSel ? 'true' : 'false');
    });
  }

  function select(id, userAction) {
    state.selId = id;
    syncSelection();
    renderReader();
    if (window.innerWidth <= 1180) openReaderSheet();
    if (userAction) {
      var it = findItem(id);
      if (it) {
        recent = [id].concat(recent.filter(function (x) { return x !== id; })).slice(0, 12);
        App.store.set('tsq3.recent', recent);
      }
    }
  }

  function openReaderSheet() {
    dom.reader.classList.add('open');
    dom.scrim.hidden = false;
    dom.scrim.dataset.for = 'reader';
    document.body.classList.add('no-scroll');
  }

  function closeReader() {
    if (!dom.reader.classList.contains('open')) return;
    dom.reader.classList.remove('open');
    if (dom.scrim.dataset.for === 'reader') {
      dom.scrim.hidden = true;
      dom.scrim.dataset.for = '';
      document.body.classList.remove('no-scroll');
    }
  }

  var FS_STEPS = [14.5, 16, 18];

  function fsNow() { return fontSize || 16; }

  function stepFont(dir) {
    var i = FS_STEPS.indexOf(fsNow());
    if (i < 0) i = 1;
    i = Math.max(0, Math.min(FS_STEPS.length - 1, i + dir));
    fontSize = FS_STEPS[i];
    App.store.set('tsq3.fs', fontSize);
    var box = dom.reader.querySelector('.rd-text');
    if (box) box.style.fontSize = fontSize + 'px';
    syncFont();
  }

  /** 字号到上下限时禁用对应按钮，避免连点无反应。 */
  function syncFont() {
    var lab = dom.reader.querySelector('.rd-fs');
    if (lab) lab.textContent = String(Math.round(fontSize));
    var i = FS_STEPS.indexOf(fsNow());
    var dn = dom.reader.querySelector('.rd-tools [data-fs="-1"]');
    var up = dom.reader.querySelector('.rd-tools [data-fs="1"]');
    if (dn) dn.disabled = i <= 0;
    if (up) up.disabled = i >= FS_STEPS.length - 1;
  }

  var HEAD_PAT = [
    /^[一二三四五六七八九十百]+[、.．]/,
    /^[（(][一二三四五六七八九十百]+[）)]/,
    /^第[一二三四五六七八九十百千零〇\d]+条/,
    /^\d{1,2}[、.．]/
  ];

  /** 目录只认短标题行，避免把整段以「一、」开头的正文误当章节。 */
  function isHeading(text) {
    if (!text || text.length > 48) return false;
    for (var i = 0; i < HEAD_PAT.length; i++) if (HEAD_PAT[i].test(text)) return true;
    return false;
  }

  function searchMainSite(kw) {
    kw = String(kw || '').replace(/\s+/g, '').slice(0, 40);
    if (!kw) return;
    window.open('https://www.chinatax.gov.cn/search5/html/searchResult.html?siteCode=bm29000002&left_right_index=0&searchSource=0&searchWord=' +
      encodeURIComponent(kw), '_blank', 'noopener');
  }

  function searchAlike(it) {
    if (it.x) { state.filters.tax.clear(); state.filters.tax.add(it.x); }
    if (it.k !== 'policy' && usesAvail()) {
      state.filters.kind.clear();
      state.filters.kind.add(it.k);
    }
    dom.input.value = '';
    state.q = '';
    renderDockTools(); renderContext(); refresh();
  }

  function renderReader() {
    var it = currentItem();
    clear(dom.reader);
    if (!it) { renderOverview(); return; }

    var idx = state.results.findIndex(function (r) { return r.id === it.id; });
    var total = state.results.length;
    var posTxt = idx >= 0 ? U.fmt(idx + 1) + ' / ' + U.fmt(total) : '不在当前结果';

    var head = h('div', { class: 'rd-head' }, [
      h('span', { class: 'rd-kind k-' + it.k, text: kindFull(it.k) }),
      h('span', { class: 'sp' }),
      h('div', { class: 'rd-nav' }, [
        h('button', {
          class: 'mini-btn', text: '↑', title: '上一条（K）', 'aria-label': '上一条',
          onclick: function () { moveSel(-1); }
        }),
        h('span', { class: 'rd-pos', text: posTxt, title: '当前条在结果中的位置' }),
        h('button', {
          class: 'mini-btn', text: '↓', title: '下一条（J）', 'aria-label': '下一条',
          onclick: function () { moveSel(1); }
        })
      ]),
      h('button', { class: 'mini-btn', title: '收藏 / 取消收藏', dataset: { on: favSet.has(it.id) ? '1' : '0' },
        onclick: function (e) {
          toggleFav(it.id);
          var on = favSet.has(it.id);
          var btn = e.currentTarget;
          btn.dataset.on = on ? '1' : '0';
          btn.firstChild.textContent = on ? '★ 已收藏' : '☆ 收藏';
        } }, [h('span', { text: favSet.has(it.id) ? '★ 已收藏' : '☆ 收藏' })]),
      U.safeUrl(it.u) ? h('button', {
        class: 'mini-btn', text: it.k === 'ksdy' ? '原站观看视频 ↗' : '原文 ↗',
        onclick: function () { window.open(U.safeUrl(it.u), '_blank', 'noopener'); }
      }) : null,
      h('button', { class: 'mini-btn rd-close', text: '关闭', onclick: closeReader })
    ]);

    var body = h('div', { class: 'rd-body' });

    var kicker = h('div', { class: 'rd-kicker' });
    if (it.w) kicker.appendChild(pill(it.w));
    if (it.x) kicker.appendChild(h('span', { text: it.x }));
    if (it.p) kicker.appendChild(h('span', { text: (kicker.children.length ? '· ' : '') + it.p }));
    if (it.d) kicker.appendChild(h('span', { text: (kicker.children.length ? '· ' : '') + it.d }));
    if (kicker.children.length) body.appendChild(kicker);

    body.appendChild(h('h1', { class: 'rd-title' }, it.t));

    var dl = h('dl', { class: 'rd-meta' });
    function addMeta(label, value, asCode) {
      if (!value) return;
      dl.appendChild(h('dt', { text: label }));
      if (asCode) {
        dl.appendChild(h('dd', {}, h('code', {
          text: value, title: '点击复制文号',
          onclick: function () { copy(value, '文号已复制'); }
        })));
      } else {
        dl.appendChild(h('dd', {}, h('span', { text: value })));
      }
    }
    addMeta('文号', it.n, true);
    addMeta('发布机关', it.o);
    addMeta('发布日期', it.d);
    addMeta('税种', it.x && it.x !== it.c ? it.x + '（' + it.c + '）' : it.x);
    addMeta('地区', it.p);
    addMeta('效力', it.w);
    addMeta('有效期', it.ws);
    addMeta('资料来源', it.src || it.sc);
    if (dl.children.length) body.appendChild(dl);

    // 正文 / 摘要片段的数据来源（仅索引条目的 q 是源站截断摘要，不是正文）
    var bodyText = it.k === 'policy' ? it.kk : (it.q || it.s);

    // 要点：仅索引条目的 brief 从 kk（=== q）里抽，与下方「摘要片段」同源，不能展示两次
    var brief = briefOf(it);
    if (brief && !(it.av === 'index' && !it.s) &&
        U.norm(brief) !== U.norm(bodyText || '')) {
      body.appendChild(h('section', { class: 'rd-sec' }, [
        h('div', { class: 'rd-sec-t' }, [h('span', { text: it.s ? 'AI 摘要' : '关键摘录' })]),
        h('div', { class: 'brief' }, [
          it.s ? h('b', { text: 'SUMMARY' }) : null,
          h('span', { text: brief })
        ])
      ]));
    }

    // 可视答疑：原站带 X-Frame-Options，内嵌必然失败，明确引导到原站
    if (it.k === 'ksdy') {
      body.appendChild(h('div', { class: 'rd-hint' }, [
        h('b', { text: '原站视频' }),
        h('span', { text: '官方页面禁止嵌入播放，本站不内嵌视频；点击右上角「原站观看视频 ↗」在官方页面观看。' })
      ]));
    }

    // 正文
    var paras = bodyText
      ? String(bodyText).split(/\n{1,}/).filter(function (p) { return p.trim(); })
      : [];
    var heads = [];
    paras.forEach(function (p, i) {
      var t = p.trim();
      if (isHeading(t)) heads.push({ i: i, t: t });
    });
    if (heads.length > 30) heads = heads.slice(0, 30);

    /** 仅索引条目的兜底说明；有截断摘要时文案要区分，不能把摘要说成正文。 */
    function indexNote(hasExcerpt) {
      return h('div', { class: 'rd-index-note' }, [
        h('b', { text: '该条目只有索引' }),
        h('p', { text: (hasExcerpt
          ? '源站只给出截断摘要，未提供正文或可用链接。'
          : '源站未提供正文或可用链接，只能用标题、日期定位。') +
          '可复制标题到税务总局站点检索，或在同类条目中继续查找。' }),
        h('div', { class: 'rd-actions' }, [
          h('button', { class: 'mini-btn', text: '复制标题', onclick: function () { copy(it.t, '标题已复制'); } }),
          h('button', { class: 'mini-btn', text: '总局检索此标题 ↗', onclick: function () { searchMainSite(it.t); } }),
          h('button', { class: 'mini-btn', text: '搜索同类', onclick: function () { searchAlike(it); } })
        ])
      ]);
    }

    // 列表把这类条目标为「仅索引」，阅读窗就不能把 30 来字的截断摘要当「内容」展示
    if (bodyText && it.av === 'index') {
      var exBox = h('div', { class: 'rd-text', text: String(bodyText) });
      if (fontSize) exBox.style.fontSize = fontSize + 'px';
      body.appendChild(h('section', { class: 'rd-sec' }, [
        h('div', { class: 'rd-sec-t' }, [h('span', { text: '摘要片段' })]), exBox
      ]));
      body.appendChild(indexNote(true));
    } else if (bodyText) {
      var textBox = h('div', { class: 'rd-text' });
      if (fontSize) textBox.style.fontSize = fontSize + 'px';
      paras.forEach(function (p, i) {
        var el = h('p', {
          class: i === 0 && /公告|通知|规定|办法/.test(p) ? 'lead' : '',
          text: p.trim()
        });
        if (heads.some(function (hd) { return hd.i === i; })) el.id = 'rdh' + i;
        textBox.appendChild(el);
      });
      var sec = h('section', { class: 'rd-sec' }, [
        h('div', { class: 'rd-sec-t' }, [h('span', { text: it.k === 'policy' ? '全文' : '内容' })]),
        textBox
      ]);
      if (paras.length > 9) {
        textBox.classList.add('clamp');
        sec.appendChild(h('button', {
          class: 'expand-btn', text: '展开全文（共 ' + paras.length + ' 段）',
          onclick: function (e) {
            textBox.classList.remove('clamp');
            e.target.remove();
          }
        }));
      }
      body.appendChild(sec);
    } else if (it.av === 'index') {
      body.appendChild(indexNote(false));
    } else {
      body.appendChild(h('div', { class: 'brief',
        text: it.k === 'policy'
          ? '该文件未收录正文（多为图解、附件或转载页），可点击右上角「原文 ↗」查看发布页面。'
          : '该条目未收录正文，可点击右上角「原文 ↗」查看发布页面。' }));
      if (U.safeUrl(it.u)) {
        body.appendChild(h('div', { class: 'rd-actions', style: 'margin-top:10px' }, [
          h('button', { class: 'mini-btn', text: '打开原文 ↗', onclick: function () { window.open(U.safeUrl(it.u), '_blank', 'noopener'); } }),
          h('button', { class: 'mini-btn', text: '复制链接', onclick: function () { copy(U.safeUrl(it.u), '链接已复制'); } })
        ]));
      }
    }

    // 附件
    var atts = parseAttachments(it.at);
    if (atts.length) {
      var att = h('section', { class: 'rd-sec' }, [
        h('div', { class: 'rd-sec-t' }, [h('span', { text: '附件 ' + atts.length })]),
        h('div', { class: 'att' })
      ]);
      atts.slice(0, 8).forEach(function (a) {
        var href = U.safeUrl(a.url);
        if (!href) return;
        att.querySelector('.att').appendChild(h('a', {
          href: href, target: '_blank', rel: 'noopener noreferrer', text: a.name
        }));
      });
      body.appendChild(att);
    }

    // 关键词
    var tags = parseTags(it.g);
    if (tags.length) {
      var tagBox = h('div', { class: 'rd-tags' });
      tags.forEach(function (t) {
        tagBox.appendChild(h('button', {
          class: 't', text: t,
          onclick: function () { dom.input.value = t; state.q = t; refresh(); }
        }));
      });
      body.appendChild(h('section', { class: 'rd-sec' }, [
        h('div', { class: 'rd-sec-t' }, [h('span', { text: '关键词' })]), tagBox
      ]));
    }

    // 操作（仅索引条目已在上面给出专属入口，避免重复按钮）
    if (it.av !== 'index') {
      body.appendChild(h('div', { class: 'rd-actions' }, [
        D.clientSafe || !bodyText ? null : h('button', {

        ])
      ]);
      rel.forEach(function (r) {

      }) : null,

        class: 'mini-btn', text: 'A', title: '恢复默认字号',

          if (b) b.style.fontSize = '16px';
          syncFont();
        }
      }),
      h('button', {
        class: 'mini-btn', text: 'A+', title: '放大正文字号', dataset: { fs: '1' },
        onclick: function () { stepFont(1); }
      }),
      h('span', { class: 'rd-fs', text: String(Math.round(fsNow())), title: '当前正文字号（px）' }),

  function jumpTo(id) {
    var inList = state.results.some(function (r) { return r.id === id; });
    if (!inList) {
      state.q = '';
      dom.input.value = '';
      resetFiltersQuiet();
      refresh().then(function () { select(id, true); scrollToSel(); });
      return;
    }
    select(id, true);
    scrollToSel();
  }

  function resetFiltersQuiet() {
    state.filters.tax.clear(); state.filters.year.clear();
    state.filters.region.clear(); state.filters.status.clear();
    state.favOnly = false;
    renderDockTools(); renderContext();
  }

  function scrollToSel() {
    var idx = state.results.findIndex(function (r) { return r.id === state.selId; });
    if (idx < 0) return;
    var top = idx * ROW_H;
    if (top < dom.vlist.scrollTop || top + ROW_H > dom.vlist.scrollTop + dom.vlist.clientHeight) {
      dom.vlist.scrollTop = Math.max(0, top - dom.vlist.clientHeight / 2 + ROW_H / 2);
    }
  }

  function toggleFav(id) {
    if (favSet.has(id)) favSet.delete(id);
    else favSet.add(id);
    App.store.set('tsq3.fav', Array.from(favSet));
    toast(favSet.has(id) ? '已加入收藏' : '已取消收藏');
    if (state.favOnly) refresh();
  }

  function related(it) {
    var poolItems = D.dataset(state.scope);
    var out = [];
    function byDate(a, b) {
      var ad = a.dk || '', bd = b.dk || '';
      return ad < bd ? 1 : ad > bd ? -1 : 0;
    }
    for (var i = 0; i < poolItems.length; i++) {
      var x = poolItems[i];
      if (x.id === it.id) continue;
      if (x.k !== it.k) continue;
      if (it.k === 'policy') {
        if (it.x && x.x === it.x) out.push(x);
      } else {
        out.push(x);
      }
      // 同栏目可能有几万条：只保留最近的候选，避免每次渲染都全量排序
      if (out.length > 40) { out.sort(byDate); out = out.slice(0, 5); }
    }
    out.sort(byDate);
    return out.slice(0, 5);
  }

  function briefOf(it) {
    if (it.s) return it.s;
    if (!it.kk) return '';
    var text = String(it.kk).replace(/\s+/g, ' ');
    var sents = text.replace(/([。；])/g, '$1\u0001').split('\u0001')
      .map(function (s) { return s.trim(); })
      .filter(function (s) { return s.length >= 12; });
    var key = /(税率|征收率|扣除|免征|不得|应当|自\d{4}年|起施行|按\s*\d|%|万元|亿元)/;
    var picked = [];
    for (var i = 0; i < sents.length && picked.length < 2; i++) {
      if (key.test(sents[i]) && picked.indexOf(sents[i]) < 0) picked.push(sents[i]);
    }
    if (!picked.length) picked = sents.slice(0, 1);
    var out = picked.join('');
    return out.length > 180 ? out.slice(0, 180) + '…' : out;
  }

  function parseAttachments(raw) {
    if (!raw) return [];
    var out = [], re = /['"]([^'"]+\.(?:pdf|docx?|xlsx?|wps|zip|rar|txt))['"]\s*,\s*['"](https?:\/\/[^'"]+)['"]/gi;
    var m;
    while ((m = re.exec(raw)) !== null) out.push({ name: m[1], url: m[2] });
    if (!out.length) {
      var re2 = /(https?:\/\/[^'"\],\s]+)/g;
      var n = 0;
      while ((m = re2.exec(raw)) !== null && n < 8) {
        out.push({ name: decodeURIComponent(m[1].split('/').pop() || '附件'), url: m[1] });
        n++;
      }
    }
    return out;
  }

  function parseTags(raw) {
    if (!raw) return [];
    var out = [], re = /['"]([^'"]{2,24})['"]/g, m;
    while ((m = re.exec(raw)) !== null) {
      if (out.indexOf(m[1]) < 0) out.push(m[1]);
    }
    return out.slice(0, 10);
  }

  /* ---------------- 概览（未选中） ---------------- */

  function renderOverview() {
    var items = D.dataset(state.scope);
    var pm = (D.policy && D.policy.m) || {};
    var maxd = scopeSnapshot();
    var valid = 0, yearNew = 0, readable = 0;
    var thisYear = String(new Date().getFullYear());
    for (var i = 0; i < items.length; i++) {
      if (items[i].w === '全文有效') valid++;
      if ((items[i].dk || '').slice(0, 4) === thisYear) yearNew++;
      if (items[i].av !== 'index') readable++;
    }

    var box = h('div', { class: 'rd-empty' }, [
      h('h2', { text: '档案速览' }),
      h('p', { class: 'sub', text: '数据截至 ' + maxd +
        (state.scope === 'policy' ? ' · 同文合并 ' + U.fmt(pm.mg || 0) + ' 条' : '') +
        ' · 版本 ' + (D.version || '—') })
    ]);

    // 政策看采集新鲜度；知识库 / 全部按栏目快照日算天数，不能沿用政策的 stale_days
    var st = dataStatus();
    if (state.scope !== 'policy') {
      var days = maxd && maxd !== '—' ? U.daysBetween(maxd) : null;
      if (days != null && days < 0) days = 0;
      var level = days == null ? 'unknown' : days <= 2 ? 'fresh' : days <= 13 ? 'amber' : 'red';
      st = {
        kind: level === 'red' ? 'err' : level === 'amber' || level === 'unknown' ? 'warn' : 'ok',
        head: level === 'unknown' ? '快照日期未知' :
          '栏目快照' + (days > 0 ? '（' + days + ' 天前）' : '（今天）'),
        sub: state.scope === 'all' ? '政策法规 + 税务公开资料合并视图' : '税务官方公开资料',
        maxd: maxd
      };
    }
    box.appendChild(h('div', { class: 'fresh-line', dataset: { kind: st.kind } }, [
      h('span', { class: 'dot' }),
      h('b', { text: st.head }),
      h('span', { text: ' · ' + st.sub + ' · 截至 ' + st.maxd })
    ]));

    var stats = h('div', { class: 'stat-grid' });
    function stat(v, label) {
      stats.appendChild(h('div', { class: 'stat' }, [h('b', { text: v }), h('i', { text: label })]));
    }
    if (state.scope === 'all') {
      stat(U.fmt(scopeCount('all')), '全部条目');
      stat(U.fmt(scopeCount('policy')), '政策文件');
      stat(U.fmt(scopeCount('all') - scopeCount('policy')), '公开资料');
    } else if (state.scope === 'policy') {
      stat(U.fmt(scopeCount('policy')), '收录文件');
      stat(U.fmt(valid || '—'), '现行有效');
      stat(U.fmt(yearNew), thisYear + ' 年新增');
    } else {
      stat(U.fmt(scopeCount(state.scope)), '栏目条目');
      stat(U.fmt(readable), '含正文 / 链接');
      stat(U.fmt(yearNew), thisYear + ' 年新增');
    }
    stat(D.version ? D.version.slice(0, 10) : '—', '数据版本');
    box.appendChild(stats);

    function byDate(a, b) {
      var ad = a.dk || '', bd = b.dk || '';
      return ad < bd ? 1 : ad > bd ? -1 : 0;
    }
    if (!state.q && state.sort !== 'rel' && items.length) {
      // 知识库未按日期排序：扫描一遍取最近 6 条，不整表排序
      var top = [];
      for (var k = 0; k < items.length; k++) {
        top.push(items[k]);
        if (top.length > 60) { top.sort(byDate); top = top.slice(0, 6); }
      }
      top.sort(byDate);
      var newest = top.slice(0, 6);
      var ql = h('div', { class: 'quick-list' });
      newest.forEach(function (it) {
        ql.appendChild(h('a', {
          href: '#',
          onclick: function (e) { e.preventDefault(); select(it.id, true); }
        }, [h('span', { text: it.t }), h('time', { text: it.d || '' })]));
      });
      box.appendChild(h('section', { class: 'rd-sec' }, [
        h('div', { class: 'rd-sec-t' }, [h('span', { text: '最近更新' })]), ql
      ]));
    }

    if (recent.length) {
      var rl = h('div', { class: 'quick-list' });
      var shown = 0;
      for (var r = 0; r < recent.length && shown < 6; r++) {
        var rid = recent[r], hit = null;
        for (var j = 0; j < items.length; j++) {
          if (items[j].id === rid) { hit = items[j]; break; }
        }
        if (!hit) continue;
        shown++;
        (function (item) {
          rl.appendChild(h('a', {
            href: '#',
            onclick: function (e) { e.preventDefault(); select(item.id, true); }
          }, [
            h('span', { text: item.t }),
            h('time', { text: item.d || '' })
          ]));
        })(hit);
      }
      if (shown) {
        box.appendChild(h('section', { class: 'rd-sec' }, [
          h('div', { class: 'rd-sec-t' }, [h('span', { text: '最近浏览' })]), rl
        ]));
      }
    }

    var kg = h('div', { class: 'kbd-grid' }, [
      h('kbd', { text: '⌘K' }), h('span', { text: '指令台：搜索、切换、同步' }),
      h('kbd', { text: 'J / K' }), h('span', { text: '上下切换条目' }),
      h('kbd', { text: '↵' }), h('span', { text: '打开原文链接' }),
      h('kbd', { text: 'Esc' }), h('span', { text: '关闭浮层 / 阅读窗' })
    ]);
    box.appendChild(h('section', { class: 'rd-sec' }, [
      h('div', { class: 'rd-sec-t' }, [h('span', { text: '键盘' })]), kg
    ]));

    box.appendChild(h('p', { class: 'rd-note',
      text: '本站为政策检索工具，所有结论以「原文」链接指向的发布页面为准，具体适用请以主管税务机关口径为准。' }));

    dom.reader.appendChild(box);
  }

  /* ---------------- 同步状态显示 ---------------- */

  function setStatus(text, kind) {
    dom.stLeft.textContent = '';
    dom.stLeft.appendChild(h('span', { class: 'ind' }, [
      h('span', { class: 'led' + (kind === 'busy' ? ' busy' : kind === 'err' ? ' err' : '') }),
      h('span', { text: text })
    ]));
  }

  var RING_C = 2 * Math.PI * 9;

  function setSyncRing(frac) {
    var c = dom.syncRing.querySelector('.val');
    if (!c) return;
    c.setAttribute('stroke-dasharray', RING_C.toFixed(1));
    c.setAttribute('stroke-dashoffset', (RING_C * (1 - Math.max(0, Math.min(1, frac)))).toFixed(1));
  }

  function renderSync() {
    renderContext();
    var pillEl = dom.syncPill;
    renderDataStatus();
    pillEl.dataset.state = S.phase === 'boot' ? 'checking' : S.phase;
    var label = dom.syncState, time = dom.syncTime;
    if (S.phase === 'checking') { label.textContent = '检查更新'; time.textContent = U.clock(); setSyncRing(.35); }
    else if (S.phase === 'updating') {
      label.textContent = '同步中';
      time.textContent = S.progress ? Math.round(S.progress * 100) + '%' : '…';
      setSyncRing(S.progress || .2);
    } else if (S.phase === 'error') {
      label.textContent = '同步异常';
      time.textContent = '点击重试';
      setSyncRing(1);
    } else if (S.phase === 'offline') {
      label.textContent = '离线';
      time.textContent = '读本地缓存';
      setSyncRing(1);
    } else {
      label.textContent = D.version ? '已同步' : '待同步';
      time.textContent = S.lastSync ? U.clock(new Date(S.lastSync)) + ' 更新' :
        (D.version ? D.version.slice(5, 10) + ' 版' : '—');
      var frac = S.nextAt ? 1 - Math.max(0, (S.nextAt - Date.now()) / S.pollMs) : 1;
      setSyncRing(Math.max(.06, frac));
    }
  }

  /** 把「新鲜度 + 采集三态」画到状态栏与同步胶囊，缺一不可。 */
  function renderDataStatus() {
    if (!D.policy) return;
    var st = dataStatus();
    if (dom.stFresh) {
      dom.stFresh.hidden = false;
      dom.stFresh.className = st.bad ? 'err' : (st.kind === 'warn' ? 'warn' : '');
      dom.stFresh.textContent = st.head + ' · ' + st.sub;
    }
    dom.syncPill.title = '数据同步：点击立即检查更新\n' + st.head + ' · ' +
      st.sub + ' · 数据截至 ' + st.maxd;
  }

  /* ---------------- 数据事件 ---------------- */

  function onData(e) {
    var payload = e.detail || e;
    if (payload.scope === 'policy' || payload.scope === 'library') {
      Q.invalidate();
      SCOPES.forEach(function (s) { state.indexReady[s.id] = false; });
      var affectsCurrent = (payload.scope === 'policy' &&
          (state.scope === 'policy' || state.scope === 'all')) ||
        (payload.scope === 'library' && state.scope !== 'policy');
      if (affectsCurrent) {
        renderContext();
        buildDock();
        refresh().then(function () {
          if (state.selId) renderReader();
        });
      }
      if (payload.diff && payload.diff.added > 0) {
        toast('数据已更新 · 新增 ' + U.fmt(payload.diff.added) + ' 条', 'ok');
      }
    }
  }

  /* ---------------- 版本变更与自动同步 ---------------- */

  var autoSyncing = false;
  var failedVersion = '';

  function autoSyncEnabled() {
    return App.store.get('tsq3.autosync', true) !== false;
  }

  function onManifest(m) {
    if (!D.policy) return;                      // 首屏由 boot 自己拉数据
    if (!m || m.b === D.policy.version) return; // 版本未变
    if (autoSyncing) return;
    if (m.b === failedVersion) return;          // 同一版本失败过，等用户手动重试
    if (!autoSyncEnabled()) { showUpdateBar(m); return; }
    autoSyncing = true;
    setStatus('发现新版本，后台同步中…', 'busy');
    S.fetchPolicy(m.b).then(function (r) {
      var added = r && r.diff ? r.diff.added : 0;
      toast(added ? '数据已自动更新 · 新增 ' + U.fmt(added) + ' 条' : '数据已自动更新', 'ok');
      hideUpdateBar();
      setStatus('就绪', '');
    }).catch(function (e) {
      failedVersion = m.b || '';
      toast('自动同步失败：' + e.message, 'err');
      showUpdateBar(m);
      setStatus('同步失败', 'err');
    }).then(function () { autoSyncing = false; });
  }

  function showUpdateBar(m) {
    var bar = dom.updateBar;
    clear(bar);
    bar.appendChild(h('span', { class: 'txt' }, [
      h('b', { text: '发现新版本' }),
      document.createTextNode(' · ' + (m.maxd ? '数据截至 ' + m.maxd + '，' : '') + '可立即同步')
    ]));
    bar.appendChild(h('button', {
      class: 'go', text: '立即更新',
      onclick: function () {
        hideUpdateBar();
        setStatus('同步中…', 'busy');
        S.fetchPolicy(m.b).then(function () { toast('已更新到最新版本'); setStatus('就绪', ''); })
          .catch(function (e) { toast('同步失败：' + e.message, 'err'); setStatus('同步失败', 'err'); });
      }
    }));
    bar.appendChild(h('button', { class: 'later', text: '稍后', onclick: hideUpdateBar }));
    bar.hidden = false;
  }

  function hideUpdateBar() { dom.updateBar.hidden = true; }

  /* ---------------- 键盘 ---------------- */

  function moveSel(delta) {
    if (!state.results.length) return;
    var idx = state.results.findIndex(function (r) { return r.id === state.selId; });
    idx = idx < 0 ? (delta > 0 ? 0 : 0) : Math.max(0, Math.min(state.results.length - 1, idx + delta));
    select(state.results[idx].id, true);
    scrollToSel();
    paintWindow();
  }

  function bindKeys() {
    document.addEventListener('keydown', function (e) {
      var tag = (e.target.tagName || '').toLowerCase();
      var typing = tag === 'input' || tag === 'textarea' || e.target.isContentEditable;

      if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === 'k') {
        e.preventDefault(); App.ai.openOmni(); return;
      }
      if (typing) {
        if (e.key === 'Escape' && e.target === dom.input) { dom.input.blur(); }
        return;
      }
      if (e.key === '/') { e.preventDefault(); dom.input.focus(); dom.input.select(); return; }
      if (e.key === 'j' || e.key === 'ArrowDown') { e.preventDefault(); moveSel(1); return; }
      if (e.key === 'k' || e.key === 'ArrowUp') { e.preventDefault(); moveSel(-1); return; }
      if (e.key === 'Enter') {
        var it = currentItem();
        var url = it && U.safeUrl(it.u);
        if (url) window.open(url, '_blank', 'noopener');
        return;
      }
      if (e.key === 'Escape') { closeReader(); closePop(); return; }
      if (e.key === 's' && !e.metaKey) { S.check(true).then(function (ch) { if (!ch) toast('已是最新版本'); }); }
    });
  }

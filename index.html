      tools.appendChild(chip('地区', state.filters.region.size > 0, state.filters.region.size || '',
        function (e) { openFacet('region', e.currentTarget); }));
      tools.appendChild(chip('效力', state.filters.status.size > 0, state.filters.status.size || '',
        function (e) { openFacet('status', e.currentTarget); }));
    } else {
      tools.appendChild(chip('年份', state.filters.year.size > 0, state.filters.year.size || '',
        function (e) { openFacet('year', e.currentTarget); }));
    }
    tools.appendChild(chip('收藏', state.favOnly, '', function () {
      state.favOnly = !state.favOnly;
      renderDockTools();
      refresh();
    }));
    if (hasFilters()) {
      tools.appendChild(h('button', {
        class: 'chip-btn', title: '清空全部筛选',
        onclick: function () { resetFilters(); }
      }, [h('span', { text: '清空' })]));
    }
  }

  function hasFilters() {
    return !!(state.filters.tax.size || state.filters.year.size ||
      state.filters.region.size || state.filters.status.size || state.favOnly);
  }

  function resetFilters() {
    state.filters.tax.clear();
    state.filters.year.clear();
    state.filters.region.clear();
    state.filters.status.clear();
    state.favOnly = false;
    renderDockTools();
    renderYearline();
    refresh();
  }

  /* ---------------- 筛选浮层 ---------------- */

  var popEl = null;

  function closePop() {
    if (popEl) { popEl.remove(); popEl = null; }
    document.removeEventListener('mousedown', onDocDown, true);
    document.removeEventListener('keydown', onPopKey, true);
  }

  function onDocDown(e) {
    if (popEl && !popEl.contains(e.target)) closePop();
  }

  function onPopKey(e) { if (e.key === 'Escape') { closePop(); e.stopPropagation(); } }

  function facetOptions(kind) {
    var m = D.policy ? D.policy.m : {};
    var f = (m && m.facets) || {};
    var list = [];
    if (kind === 'tax') list = f.tax || [];
    else if (kind === 'region') list = f.regions || [];
    else if (kind === 'year') list = f.years || [];
    else if (kind === 'status') list = f.status || [];
    if (kind === 'status' && !list.length) {
      list = [['全文有效', 0], ['部分失效', 0], ['全文失效', 0], ['未标注', 0]];
    }
    if (kind === 'year' && state.scope !== 'policy') {
      list = libYearFacet();
    }
    var arr = list.map(function (p) { return { v: String(p[0]), n: p[1] }; });
    if (kind === 'year') arr.sort(function (a, b) { return b.v.localeCompare(a.v); });
    else arr.sort(function (a, b) { return b.n - a.n; });
    return arr;
  }

  function libYearFacet() {
    var items = D.dataset(state.scope), map = Object.create(null);
    for (var i = 0; i < items.length; i++) {
      var m = /(\d{4})年/.exec(items[i].d || '') || /^(\d{4})/.exec(items[i].d || '');
      if (m) map[m[1]] = (map[m[1]] || 0) + 1;
    }
    return Object.keys(map).map(function (y) { return [y, map[y]]; });
  }

  function openFacet(kind, anchor) {
    closePop();
    var selected = kind === 'tax' ? state.filters.tax : kind === 'year' ? state.filters.year
      : kind === 'region' ? state.filters.region : state.filters.status;
    var opts = facetOptions(kind);
    var q = '';

    var listBox = h('div', { class: 'pop-list' });
    var pop = h('div', { class: 'pop', role: 'dialog' }, [
      h('div', { class: 'pop-hd' }, [
        h('b', { text: kind === 'tax' ? '按税种筛选' : kind === 'year' ? '按年份筛选' :
          kind === 'region' ? '按地区筛选' : '按效力筛选' }),
        h('span', { class: 'sp' }),
        h('button', { class: 'pop-x', onclick: closePop, 'aria-label': '关闭' }, '×')
      ]),
      opts.length > 8 ? h('input', {
        class: 'pop-search', placeholder: '过滤选项…',
        oninput: function (e) { q = U.norm(e.target.value); render(); }
      }) : null,
      listBox,
      h('div', { class: 'pop-ft' }, [
        h('button', { class: 'btn', text: '清空', onclick: function () { selected.clear(); render(); commit(); } }),
        h('button', { class: 'btn primary', text: '完成', onclick: function () { closePop(); } })
      ])
    ]);

    function commit() {
      renderDockTools();
      renderYearline();
      refresh();
    }

    function render() {
      clear(listBox);
      var shown = 0;
      opts.forEach(function (o) {
        if (q && U.norm(o.v).indexOf(q) < 0) return;
        shown++;
        var on = selected.has(o.v);
        listBox.appendChild(h('label', { class: 'pop-item', dataset: { on: on ? '1' : '0' } }, [
          h('input', {
            type: 'checkbox', checked: on ? 'checked' : null,
            onchange: function (e) {
              if (e.target.checked) selected.add(o.v); else selected.delete(o.v);
              commit();
            }
          }),
          h('span', { class: 'v', text: o.v }),
          h('em', { text: o.n ? U.fmt(o.n) : '' })
        ]));
      });
      if (!shown) listBox.appendChild(h('div', { class: 'pop-none', text: '没有匹配的选项' }));
    }

    render();
    document.body.appendChild(pop);
    popEl = pop;

    var r = anchor.getBoundingClientRect();
    pop.style.top = Math.round(r.bottom + 8) + 'px';
    var left = Math.round(r.left);
    pop.style.left = Math.max(10, Math.min(left, window.innerWidth - pop.offsetWidth - 10)) + 'px';

    setTimeout(function () {
      document.addEventListener('mousedown', onDocDown, true);
      document.addEventListener('keydown', onPopKey, true);
    }, 0);
  }

  /* ---------------- 档案年轮 ---------------- */

  function renderYearline() {
    var box = dom.yearline;
    clear(box);
    var opts = facetOptions('year').filter(function (o) { return o.n > 0; });
    if (opts.length < 3) { box.hidden = true; return; }
    box.hidden = false;
    var max = 1;
    opts.forEach(function (o) { if (o.n > max) max = o.n; });
    var asc = opts.slice().sort(function (a, b) { return a.v.localeCompare(b.v); });
    asc.forEach(function (o) {
      var hgt = Math.max(4, Math.round(Math.pow(o.n / max, 0.7) * 30));
      var on = state.filters.year.has(o.v);
      var last = o === asc[asc.length - 1];
      var showLabel = on || last || Number(o.v) % 5 === 0;
      box.appendChild(h('button', {
        class: 'yr', dataset: { on: on ? '1' : '0', y: o.v },
        title: o.v + ' 年 · ' + U.fmt(o.n) + ' 条',
        onclick: function () {
          if (state.filters.year.has(o.v)) state.filters.year.delete(o.v);
          else state.filters.year.add(o.v);
          renderDockTools();
          renderYearline();
          refresh();
        }
      }, [
        h('span', { class: 'bar', style: 'height:' + hgt + 'px' }),
        h('span', { class: 'lb', text: showLabel ? o.v.slice(2) : '' })
      ]));
    });
  }

  /* ---------------- 数据范围切换 ---------------- */

  function setScope(id) {
    if (state.scope === id) return;
    var sc = SCOPES.filter(function (s) { return s.id === id; })[0];
    if (!sc) return;
    state.scope = id;
    state.q = '';
    state.sort = 'date';
    dom.input.value = '';
    state.selId = '';
    state.filters.tax.clear();
    state.filters.year.clear();
    state.filters.region.clear();
    state.filters.status.clear();
    buildDock();
    setStatus('载入「' + sc.label + '」…', 'busy');

    var ready = id === 'policy' ? Promise.resolve() : S.loadLib().catch(function (e) {
      toast('知识库载入失败：' + e.message, 'err');
      return null;
    });

    ready.then(function () {
      buildDock();
      renderYearline();
      return refresh();
    }).then(function () {
      dom.vlist.scrollTop = 0;
      if (window.innerWidth <= 1180) closeReader();
    });
  }

  /* ---------------- 检索与渲染 ---------------- */

  function ensureIndex() {
    if (state.indexReady[state.scope]) return Promise.resolve();
    var items = D.dataset(state.scope);
    if (!items.length) return Promise.resolve();
    setStatus('建立索引 ' + U.fmt(items.length) + ' 条…', 'busy');
    return Q.ensure(state.scope, items, function (p) {
      dom.stMid.textContent = '建立索引 ' + Math.round(p * 100) + '%';
    }).then(function () {
      state.indexReady[state.scope] = true;
    });
  }

  function refresh() {
    var seq = ++state.seq;
    return ensureIndex().then(function () {
      if (seq !== state.seq) return;
      var res = Q.run(state.scope, state.q, {
        filters: state.filters,
        favOnly: state.favOnly,
        ids: state.favOnly ? setToMap(favSet) : null,
        sort: state.q ? 'rel' : 'date'
      });
      if (seq !== state.seq) return;
      state.results = res.items;
      state.resMeta = res;
      renderHead(res);
      renderList();
      syncSelection();
      setStatus('就绪', '');
      dom.stMid.textContent = res.browse
        ? '浏览模式 · ' + U.fmt(res.items.length) + ' 条'
        : '检索 ' + U.fmt(res.items.length) + ' 条 · ' + res.ms + 'ms';
    }).catch(function (e) {
      setStatus('检索失败：' + e.message, 'err');
    });
  }

  function setToMap(set) {
    var m = Object.create(null);
    set.forEach(function (k) { m[k] = 1; });
    return m;
  }

  function renderHead(res) {
    var total = res.total || (D.dataset(state.scope).length);
    dom.count.textContent = '';
    dom.count.appendChild(h('b', { text: U.fmt(res.items.length) }));
    dom.count.appendChild(document.createTextNode(' / ' + U.fmt(total) + ' 条'));

    clear(dom.crumb);
    if (hasFilters()) {
      var parts = [];
      state.filters.tax.forEach(function (v) { parts.push(v); });
      state.filters.status.forEach(function (v) { parts.push(v); });
      state.filters.region.forEach(function (v) { parts.push(v); });
      state.filters.year.forEach(function (v) { parts.push(v + '年'); });
      if (state.favOnly) parts.push('已收藏');
      dom.crumb.appendChild(document.createTextNode(parts.slice(0, 4).join(' · ') +
        (parts.length > 4 ? ' +' + (parts.length - 4) : '')));
    } else if (res.nq) {
      dom.crumb.appendChild(document.createTextNode('关键词「' + state.q.trim() + '」'));
    } else {
      dom.crumb.appendChild(document.createTextNode(state.scope === 'policy' ? '按发布日期倒序' : '按更新时间倒序'));
    }
    dom.sortBtn.textContent = state.q ? (state.sort === 'rel' ? '相关度优先' : '最新在前') : '最新在前';
    dom.favBtn.dataset.on = state.favOnly ? '1' : '0';
  }

  /* ---------------- 虚拟列表 ---------------- */

  var ROW_H = 74;
  var pool = new Map();
  var rafPending = false;

  function readRowHeight() {
    var v = getComputedStyle(document.documentElement).getPropertyValue('--row-h');
    ROW_H = parseFloat(v) || 74;
  }

  function renderList() {
    pool.forEach(function (el) { el.remove(); });
    pool = new Map();
    var n = state.results.length;
    dom.vspacer.style.height = (n * ROW_H) + 'px';
    dom.vlist.scrollTop = Math.min(dom.vlist.scrollTop, Math.max(0, n * ROW_H - 10));
    paintWindow(true);

    var empty = !n;
    dom.listEmpty.hidden = !empty;
    if (empty) {
      clear(dom.listEmpty);
      var hasQ = !!state.q.trim();
      dom.listEmpty.appendChild(h('b', { text: hasQ ? '没有匹配的条文' : '这个范围内还没有数据' }));
      dom.listEmpty.appendChild(h('p', { text: hasQ
        ? '试试更短的关键词（如「留抵退税」「小规模」），或清空筛选条件。'
        : '切换上方内容体系，或点击右上角同步一次。' }));
      if (hasQ && !D.clientSafe) {
        dom.listEmpty.appendChild(h('button', {
          class: 'mini-btn', text: '用 AI 回答这个问题',
          onclick: function () { App.ai.open(state.q); }
        }));
      }
    }
  }

  function paintWindow(force) {
    var scrollTop = dom.vlist.scrollTop;
    var vh = dom.vlist.clientHeight || 600;
    var n = state.results.length;
    var start = Math.max(0, Math.floor(scrollTop / ROW_H) - 5);
    var end = Math.min(n, Math.ceil((scrollTop + vh) / ROW_H) + 5);

    pool.forEach(function (el, i) {
      if (i < start || i >= end) { el.remove(); pool.delete(i); }
    });
    for (var i = start; i < end; i++) {
      if (!pool.has(i)) {
        var el = buildRow(state.results[i], i);
        dom.vrows.appendChild(el);
        pool.set(i, el);
      }
    }
    pool.forEach(function (el, i) {
      el.style.transform = 'translateY(' + (i * ROW_H) + 'px)';
    });
  }

  function onScroll() {
    if (rafPending) return;
    rafPending = true;
    requestAnimationFrame(function () { rafPending = false; paintWindow(); });
  }

  function buildRow(it, i) {
    var isSel = it.id === state.selId;
    var el = h('div', {
      class: 'row', role: 'option', tabindex: '-1',
      'aria-selected': isSel ? 'true' : 'false',
      dataset: { i: i, id: it.id },
      onclick: function () { select(it.id, true); }
    });

    var title = h('div', { class: 'r-title' });
    appendHighlighted(title, it.t, state.q);

    var meta = h('div', { class: 'r-meta' });
    if (it.n) meta.appendChild(h('span', { class: 'r-no', text: it.n }));
    if (state.scope === 'policy') {
      if (it.o) meta.appendChild(h('span', { class: 'm', text: it.o }));
      if (it.p) { meta.appendChild(h('span', { class: 'sep', text: '·' })); meta.appendChild(h('span', { text: it.p })); }
      if (it.w) meta.appendChild(pill(it.w));
    } else {
      if (it.c) meta.appendChild(h('span', { class: 'm', text: it.c }));
      if (it.s) { meta.appendChild(h('span', { class: 'sep', text: '·' })); meta.appendChild(h('span', { text: it.s })); }
      if (it.src) { meta.appendChild(h('span', { class: 'sep', text: '·' })); meta.appendChild(h('span', { class: 'm', text: it.src })); }
    }

    var side = h('div', { class: 'r-side' }, [
      h('span', { class: 'r-date', text: it.d || '' })
    ]);
    if (it._r && !state.resMeta.browse) side.appendChild(relRing(it._r));

    el.appendChild(h('div', { class: 'r-main' }, [title, meta]));
    el.appendChild(side);
    return el;
  }

  function relRing(r) {
    var C = 2 * Math.PI * 9;
    var ns = 'http://www.w3.org/2000/svg';
    var svg = document.createElementNS(ns, 'svg');
    svg.setAttribute('width', '24'); svg.setAttribute('height', '24');
    svg.setAttribute('viewBox', '0 0 24 24');
    var trk = document.createElementNS(ns, 'circle');
    trk.setAttribute('cx', '12'); trk.setAttribute('cy', '12'); trk.setAttribute('r', '9');
    trk.setAttribute('class', 'trk');
    var val = document.createElementNS(ns, 'circle');
    val.setAttribute('cx', '12'); val.setAttribute('cy', '12'); val.setAttribute('r', '9');
    val.setAttribute('class', 'val');
    val.setAttribute('stroke-dasharray', C.toFixed(1));
    val.setAttribute('stroke-dashoffset', (C * (1 - r)).toFixed(1));
    svg.appendChild(trk); svg.appendChild(val);
    return h('div', { class: 'rel', title: '相关度 ' + Math.round(r * 100) + '%' }, svg);
  }

  function pill(status) {
    var cls = status === '全文有效' ? 'ok' : status === '部分失效' ? 'part'
      : status === '全文失效' ? 'dead' : 'na';
    return h('span', { class: 'pill ' + cls, text: status });
  }

  function appendHighlighted(parent, text, q) {
    var nq = U.norm(q || '');
    if (!nq || nq.length < 2) { parent.appendChild(document.createTextNode(text)); return; }
    var toks = Q.tokens(nq).filter(function (t) { return t.length > 1; })
      .sort(function (a, b) { return b.length - a.length; }).slice(0, 8);
    if (nq.length >= 2) toks.unshift(nq);

    var low = text.toLowerCase();
    var ranges = [];
    toks.forEach(function (t) {
      var from = 0, idx, guard = 0;
      while ((idx = low.indexOf(t, from)) >= 0 && guard++ < 20) {
        ranges.push([idx, idx + t.length]);
        from = idx + t.length;
      }
    });
    if (!ranges.length) { parent.appendChild(document.createTextNode(text)); return; }
    ranges.sort(function (a, b) { return a[0] - b[0]; });
    var merged = [ranges[0]];
    for (var i = 1; i < ranges.length; i++) {
      var last = merged[merged.length - 1];
      if (ranges[i][0] <= last[1]) last[1] = Math.max(last[1], ranges[i][1]);
      else merged.push(ranges[i]);
    }
    var pos = 0;
    merged.forEach(function (r) {
      if (r[0] > pos) parent.appendChild(document.createTextNode(text.slice(pos, r[0])));
      parent.appendChild(h('mark', { text: text.slice(r[0], r[1]) }));
      pos = r[1];
    });
    if (pos < text.length) parent.appendChild(document.createTextNode(text.slice(pos)));
  }

  /* ---------------- 选中与阅读窗 ---------------- */

  function findItem(id) {
    var items = D.dataset(state.scope);
    for (var i = 0; i < items.length; i++) if (items[i].id === id) return items[i];
    return null;
  }

  function currentItem() { return state.selId ? findItem(state.selId) : null; }

  function syncSelection() {
    pool.forEach(function (el, i) {
      var isSel = state.results[i] && state.results[i].id === state.selId;
      el.setAttribute('aria-selected', isSel ? 'true' : 'false');
    });
  }

  function select(id, userAction) {
    state.selId = id;
    syncSelection();
    renderReader();
    if (window.innerWidth <= 1180) openReaderSheet();
    if (userAction) {
      var it = findItem(id);
      if (it) {
        recent = [id].concat(recent.filter(function (x) { return x !== id; })).slice(0, 12);
        App.store.set('tsq3.recent', recent);
      }
    }
  }

  function openReaderSheet() {
    dom.reader.classList.add('open');
    dom.scrim.hidden = false;
    dom.scrim.dataset.for = 'reader';
    document.body.classList.add('no-scroll');
  }

  function closeReader() {
    if (!dom.reader.classList.contains('open')) return;
    dom.reader.classList.remove('open');
    if (dom.scrim.dataset.for === 'reader') {
      dom.scrim.hidden = true;
      dom.scrim.dataset.for = '';
      document.body.classList.remove('no-scroll');
    }
  }

  function renderReader() {
    var it = currentItem();
    clear(dom.reader);
    if (!it) { renderOverview(); return; }

    var head = h('div', { class: 'rd-head' }, [
      h('span', { class: 'tag', text: it.k === 'policy' ? '政策文本' : '资料条目' }),
      h('span', { class: 'sp' }),
      h('button', {
        class: 'mini-btn rd-close', text: '关闭', style: 'display:none',
        onclick: closeReader
      }),
      h('button', { class: 'mini-btn', title: '收藏 / 取消收藏', dataset: { on: favSet.has(it.id) ? '1' : '0' },
        onclick: function (e) {
          toggleFav(it.id);
          var on = favSet.has(it.id);
          var btn = e.currentTarget;
          btn.dataset.on = on ? '1' : '0';
          btn.firstChild.textContent = on ? '★ 已收藏' : '☆ 收藏';
        } }, [h('span', { text: favSet.has(it.id) ? '★ 已收藏' : '☆ 收藏' })]),
      U.safeUrl(it.u) ? h('button', {
        class: 'mini-btn', text: '原文 ↗',
        onclick: function () { window.open(U.safeUrl(it.u), '_blank', 'noopener'); }
      }) : null
    ]);

    var body = h('div', { class: 'rd-body' });

    var kicker = h('div', { class: 'rd-kicker' });
    if (it.w) kicker.appendChild(pill(it.w));
    if (it.x) kicker.appendChild(h('span', { text: it.x }));
    if (it.p) kicker.appendChild(h('span', { text: (kicker.children.length ? '· ' : '') + it.p }));
    if (it.d) kicker.appendChild(h('span', { text: (kicker.children.length ? '· ' : '') + it.d }));
    if (kicker.children.length) body.appendChild(kicker);

    body.appendChild(h('h1', { class: 'rd-title' }, it.t));

    var dl = h('dl', { class: 'rd-meta' });
    function addMeta(label, value, asCode) {
      if (!value) return;
      dl.appendChild(h('dt', { text: label }));
      if (asCode) {
        dl.appendChild(h('dd', {}, h('code', {
          text: value, title: '点击复制文号',
          onclick: function () { copy(value, '文号已复制'); }
        })));
      } else {
        dl.appendChild(h('dd', {}, h('span', { text: value })));
      }
    }
    addMeta('文号', it.n, true);
    addMeta('发布机关', it.o);
    addMeta('发布日期', it.d);
    addMeta('税种', it.x && it.x !== it.c ? it.x + '（' + it.c + '）' : it.x);
    addMeta('地区', it.p);
    addMeta('效力', it.w);
    addMeta('有效期', it.ws);
    addMeta('资料来源', it.src || it.sc);
    if (dl.children.length) body.appendChild(dl);

    // 要点
    var brief = briefOf(it);
    if (brief) {
      body.appendChild(h('section', { class: 'rd-sec' }, [
        h('div', { class: 'rd-sec-t' }, [h('span', { text: it.s ? 'AI 摘要' : '关键摘录' })]),
        h('div', { class: 'brief' }, [
          it.s ? h('b', { text: 'SUMMARY' }) : null,
          h('span', { text: brief })
        ])
      ]));
    }

    // 正文
    var bodyText = it.k === 'policy' ? it.kk : (it.q || it.s);
    if (bodyText) {
      var paras = String(bodyText).split(/\n{1,}/).filter(function (p) { return p.trim(); });
      var textBox = h('div', { class: 'rd-text' });
      paras.forEach(function (p, i) {
        textBox.appendChild(h('p', { class: i === 0 && /公告|通知|规定|办法/.test(p) ? 'lead' : '', text: p.trim() }));
      });
      var sec = h('section', { class: 'rd-sec' }, [
        h('div', { class: 'rd-sec-t' }, [h('span', { text: it.k === 'policy' ? '全文' : '内容' })]),
        textBox
      ]);
      if (paras.length > 9) {
        textBox.classList.add('clamp');
        sec.appendChild(h('button', {
          class: 'expand-btn', text: '展开全文（共 ' + paras.length + ' 段）',
          onclick: function (e) {
            textBox.classList.remove('clamp');
            e.target.remove();
          }
        }));
      }
      body.appendChild(sec);
    } else {
      body.appendChild(h('div', { class: 'brief',
        text: U.safeUrl(it.u)
          ? (it.k === 'policy'
            ? '该文件未收录正文（多为图解、附件或转载页），可点击右上角「原文 ↗」查看发布页面。'
            : '该条目未收录正文，可点击右上角「原文 ↗」查看发布页面。')
          : '该条目仅收录标题与文号，未收录正文与原文链接，请按标题/文号到税务总局官网检索核对。' }));
      if (U.safeUrl(it.u)) {
        body.appendChild(h('div', { class: 'rd-actions', style: 'margin-top:10px' }, [
          h('button', { class: 'mini-btn', text: '打开原文 ↗', onclick: function () { window.open(U.safeUrl(it.u), '_blank', 'noopener'); } }),
          h('button', { class: 'mini-btn', text: '复制链接', onclick: function () { copy(U.safeUrl(it.u), '链接已复制'); } })
        ]));
      }
    }

    // 附件
    var atts = parseAttachments(it.at);
    if (atts.length) {
      var att = h('section', { class: 'rd-sec' }, [
        h('div', { class: 'rd-sec-t' }, [h('span', { text: '附件 ' + atts.length })]),
        h('div', { class: 'att' })
      ]);
      atts.slice(0, 8).forEach(function (a) {
        var href = U.safeUrl(a.url);
        if (!href) return;
        att.querySelector('.att').appendChild(h('a', {
          href: href, target: '_blank', rel: 'noopener noreferrer', text: a.name
        }));
      });
      body.appendChild(att);
    }

    // 关键词
    var tags = parseTags(it.g);
    if (tags.length) {
      var tagBox = h('div', { class: 'rd-tags' });
      tags.forEach(function (t) {
        tagBox.appendChild(h('button', {
          class: 't', text: t,
          onclick: function () { dom.input.value = t; state.q = t; refresh(); }
        }));
      });
      body.appendChild(h('section', { class: 'rd-sec' }, [
        h('div', { class: 'rd-sec-t' }, [h('span', { text: '关键词' })]), tagBox
      ]));
    }

    // 操作
    body.appendChild(h('div', { class: 'rd-actions' }, [
      D.clientSafe ? null : h('button', {
        class: 'mini-btn primary', text: 'AI 解读这篇',
        onclick: function () { App.ai.open('请概括《' + it.t + '》的核心要点、适用条件与办理口径', [it]); }
      }),
      h('button', {
        class: 'mini-btn', text: '搜索同类',
        onclick: function () {
          if (it.x) { state.filters.tax.clear(); state.filters.tax.add(it.x); }
          dom.input.value = '';
          state.q = '';
          renderDockTools(); renderYearline(); refresh();
        }
      })
    ]));

    // 相关
    var rel = related(it);
    if (rel.length) {
      var relBox = h('section', { class: 'rd-sec rd-rel' }, [
        h('div', { class: 'rd-sec-t' }, [h('span', { text: '相关条文' })])
      ]);
      rel.forEach(function (r) {
        relBox.appendChild(h('a', {
          href: '#', text: r.t,
          onclick: function (e) { e.preventDefault(); jumpTo(r.id); }
        }));
      });
      body.appendChild(relBox);
    }

    dom.reader.appendChild(head);
    dom.reader.appendChild(body);
    dom.reader.scrollTop = 0;
  }

  function jumpTo(id) {
    var inList = state.results.some(function (r) { return r.id === id; });
    if (!inList) {
      state.q = '';
      dom.input.value = '';
      resetFiltersQuiet();
      refresh().then(function () { select(id, true); scrollToSel(); });
      return;
    }
    select(id, true);
    scrollToSel();
  }

  function resetFiltersQuiet() {
    state.filters.tax.clear(); state.filters.year.clear();
    state.filters.region.clear(); state.filters.status.clear();
    state.favOnly = false;
    renderDockTools(); renderYearline();
  }

  function scrollToSel() {
    var idx = state.results.findIndex(function (r) { return r.id === state.selId; });
    if (idx < 0) return;
    var top = idx * ROW_H;
    if (top < dom.vlist.scrollTop || top + ROW_H > dom.vlist.scrollTop + dom.vlist.clientHeight) {
      dom.vlist.scrollTop = Math.max(0, top - dom.vlist.clientHeight / 2 + ROW_H / 2);
    }
  }

  function toggleFav(id) {
    if (favSet.has(id)) favSet.delete(id);
    else favSet.add(id);
    App.store.set('tsq3.fav', Array.from(favSet));
    toast(favSet.has(id) ? '已加入收藏' : '已取消收藏');
    if (state.favOnly) refresh();
  }

  function related(it) {
    var poolItems = D.dataset(state.scope);
    var out = [];
    for (var i = 0; i < poolItems.length && out.length < 40; i++) {
      var x = poolItems[i];
      if (x.id === it.id) continue;
      if (it.x && x.x === it.x) out.push(x);
    }
    out.sort(function (a, b) { return a.d < b.d ? 1 : -1; });
    return out.slice(0, 5);
  }

  function briefOf(it) {
    if (it.s) return it.s;
    if (!it.kk) return '';
    var text = String(it.kk).replace(/\s+/g, ' ');
    var sents = text.replace(/([。；])/g, '$1\u0001').split('\u0001')
      .map(function (s) { return s.trim(); })
      .filter(function (s) { return s.length >= 12; });
    var key = /(税率|征收率|扣除|免征|不得|应当|自\d{4}年|起施行|按\s*\d|%|万元|亿元)/;
    var picked = [];
    for (var i = 0; i < sents.length && picked.length < 2; i++) {
      if (key.test(sents[i]) && picked.indexOf(sents[i]) < 0) picked.push(sents[i]);
    }
    if (!picked.length) picked = sents.slice(0, 1);
    var out = picked.join('');
    return out.length > 180 ? out.slice(0, 180) + '…' : out;
  }

  function parseAttachments(raw) {
    if (!raw) return [];
    var out = [], re = /['"]([^'"]+\.(?:pdf|docx?|xlsx?|wps|zip|rar|txt))['"]\s*,\s*['"](https?:\/\/[^'"]+)['"]/gi;
    var m;
    while ((m = re.exec(raw)) !== null) out.push({ name: m[1], url: m[2] });
    if (!out.length) {
      var re2 = /(https?:\/\/[^'"\],\s]+)/g;
      var n = 0;
      while ((m = re2.exec(raw)) !== null && n < 8) {
        out.push({ name: decodeURIComponent(m[1].split('/').pop() || '附件'), url: m[1] });
        n++;
      }
    }
    return out;
  }

  function parseTags(raw) {
    if (!raw) return [];
    var out = [], re = /['"]([^'"]{2,24})['"]/g, m;
    while ((m = re.exec(raw)) !== null) {
      if (out.indexOf(m[1]) < 0) out.push(m[1]);
    }
    return out.slice(0, 10);
  }

  /* ---------------- 概览（未选中） ---------------- */

  function renderOverview() {
    var items = D.dataset(state.scope);
    var m = D.policy ? D.policy.m : {};
    var maxd = (m && (m.source_maxd || m.maxd)) || '—';
    var valid = 0, yearNew = 0;
    var thisYear = String(new Date().getFullYear());
    for (var i = 0; i < items.length; i++) {
      if (items[i].w === '全文有效') valid++;
      if ((items[i].d || '').slice(0, 4) === thisYear) yearNew++;
    }

    var box = h('div', { class: 'rd-empty' }, [
      h('h2', { text: '档案速览' }),
      h('p', { class: 'sub', text: '数据截至 ' + maxd + ' · 同文合并 ' +
        U.fmt(m.mg) + ' 条 · 版本 ' + (D.version || '—') })
    ]);

    var st = dataStatus();
    box.appendChild(h('div', { class: 'fresh-line', dataset: { kind: st.kind } }, [
      h('span', { class: 'dot' }),
      h('b', { text: st.head }),
      h('span', { text: ' · ' + st.sub + ' · 截至 ' + st.maxd })
    ]));

    var stats = h('div', { class: 'stat-grid' });
    function stat(v, label) {
      stats.appendChild(h('div', { class: 'stat' }, [h('b', { text: v }), h('i', { text: label })]));
    }
    stat(U.fmt(scopeCount(state.scope)), state.scope === 'policy' ? '收录文件' : '条目');
    stat(U.fmt(valid || '—'), '现行有效');
    stat(U.fmt(yearNew), thisYear + ' 年新增');
    stat(D.version ? D.version.slice(0, 10) : '—', '数据版本');
    box.appendChild(stats);

    var newest = items.slice(0, 6);
    if (!state.q && state.sort === 'date') {
      var ql = h('div', { class: 'quick-list' });
      newest.forEach(function (it) {
        ql.appendChild(h('a', {
          href: '#',
          onclick: function (e) { e.preventDefault(); select(it.id, true); }
        }, [h('span', { text: it.t }), h('time', { text: it.d || '' })]));
      });
      box.appendChild(h('section', { class: 'rd-sec' }, [
        h('div', { class: 'rd-sec-t' }, [h('span', { text: '最近更新' })]), ql
      ]));
    }

    var kg = h('div', { class: 'kbd-grid' }, [
      h('kbd', { text: '⌘K' }), h('span', { text: '指令台：搜索、切换、同步' }),
      h('kbd', { text: 'J / K' }), h('span', { text: '上下切换条目' }),
      h('kbd', { text: '↵' }), h('span', { text: '打开原文链接' }),
      h('kbd', { text: 'Esc' }), h('span', { text: '关闭浮层 / 阅读窗' })
    ]);
    box.appendChild(h('section', { class: 'rd-sec' }, [
      h('div', { class: 'rd-sec-t' }, [h('span', { text: '键盘' })]), kg
    ]));

    box.appendChild(h('p', { class: 'rd-note',
      text: '本站为政策目录检索原型（离线快照 2026-10-28，政策 11,548 条、资料 72,053 条），仅提供标题/文号/摘要级信息，部分条目未收录原文链接；引用前请以税务总局及主管税务机关发布的原文为准。' }));

    dom.reader.appendChild(box);
  }

  /* ---------------- 同步状态显示 ---------------- */

  function setStatus(text, kind) {
    dom.stLeft.textContent = '';
    dom.stLeft.appendChild(h('span', { class: 'ind' }, [
      h('span', { class: 'led' + (kind === 'busy' ? ' busy' : kind === 'err' ? ' err' : '') }),
      h('span', { text: text })
    ]));
  }

  var RING_C = 2 * Math.PI * 9;

  function setSyncRing(frac) {
    var c = dom.syncRing.querySelector('.val');
    if (!c) return;
    c.setAttribute('stroke-dasharray', RING_C.toFixed(1));
    c.setAttribute('stroke-dashoffset', (RING_C * (1 - Math.max(0, Math.min(1, frac)))).toFixed(1));
  }

  function renderSync() {
    var pillEl = dom.syncPill;
    renderDataStatus();
    pillEl.dataset.state = S.phase === 'boot' ? 'checking' : S.phase;
    var label = dom.syncState, time = dom.syncTime;
    if (S.phase === 'checking') { label.textContent = '检查更新'; time.textContent = U.clock(); setSyncRing(.35); }
    else if (S.phase === 'updating') {
      label.textContent = '同步中';
      time.textContent = S.progress ? Math.round(S.progress * 100) + '%' : '…';
      setSyncRing(S.progress || .2);
    } else if (S.phase === 'error') {
      label.textContent = '同步异常';
      time.textContent = '点击重试';
      setSyncRing(1);
    } else if (S.phase === 'offline') {
      label.textContent = '离线';
      time.textContent = '读本地缓存';
      setSyncRing(1);
    } else {
      label.textContent = D.version ? '快照' : '待载入';
      time.textContent = S.lastSync ? U.clock(new Date(S.lastSync)) + ' 更新' :
        (D.version ? D.version.slice(5, 10) + ' 版' : '—');
      var frac = S.nextAt ? 1 - Math.max(0, (S.nextAt - Date.now()) / S.pollMs) : 1;
      setSyncRing(Math.max(.06, frac));
    }
  }

  /** 把「新鲜度 + 采集三态」画到状态栏与同步胶囊，缺一不可。 */
  function renderDataStatus() {
    if (!D.policy) return;
    var st = dataStatus();
    if (dom.stFresh) {
      dom.stFresh.hidden = false;
      dom.stFresh.className = st.bad ? 'err' : (st.kind === 'warn' ? 'warn' : '');
      dom.stFresh.textContent = st.head + ' · ' + st.sub;
    }
    dom.syncPill.title = '数据同步：点击立即检查更新\n' + st.head + ' · ' +
      st.sub + ' · 数据截至 ' + st.maxd;
  }

  /* ---------------- 数据事件 ---------------- */

  function onData(e) {
    var payload = e.detail || e;
    if (payload.scope === 'policy' || payload.scope === 'library') {
      Q.invalidate();
      SCOPES.forEach(function (s) { state.indexReady[s.id] = false; });
      if (state.scope === 'policy' && payload.scope === 'policy') {
        renderYearline();
        buildDock();
        refresh();
        if (state.selId) renderReader();
      } else if (payload.scope === 'library' && state.scope !== 'policy') {
        buildDock();
        renderYearline();
        refresh();
      }
      if (payload.diff && payload.diff.added > 0) {
        toast('数据已更新 · 新增 ' + U.fmt(payload.diff.added) + ' 条', 'ok');
      }
    }
  }

  /* ---------------- 版本变更与自动同步 ---------------- */

  var autoSyncing = false;
  var failedVersion = '';

  function autoSyncEnabled() {
    return App.store.get('tsq3.autosync', true) !== false;
  }

  function onManifest(m) {
    if (!D.policy) return;                      // 首屏由 boot 自己拉数据
    if (!m || m.b === D.policy.version) return; // 版本未变
    if (autoSyncing) return;
    if (m.b === failedVersion) return;          // 同一版本失败过，等用户手动重试
    if (!autoSyncEnabled()) { showUpdateBar(m); return; }
    autoSyncing = true;
    setStatus('发现新版本，后台同步中…', 'busy');
    S.fetchPolicy(m.b).then(function (r) {
      var added = r && r.diff ? r.diff.added : 0;
      toast(added ? '数据已自动更新 · 新增 ' + U.fmt(added) + ' 条' : '数据已自动更新', 'ok');
      hideUpdateBar();
      setStatus('就绪', '');
    }).catch(function (e) {
      failedVersion = m.b || '';
      toast('自动同步失败：' + e.message, 'err');
      showUpdateBar(m);
      setStatus('同步失败', 'err');
    }).then(function () { autoSyncing = false; });
  }

  function showUpdateBar(m) {
    var bar = dom.updateBar;
    clear(bar);
    bar.appendChild(h('span', { class: 'txt' }, [
      h('b', { text: '发现新版本' }),
      document.createTextNode(' · ' + (m.maxd ? '数据截至 ' + m.maxd + '，' : '') + '可立即同步')
    ]));
    bar.appendChild(h('button', {
      class: 'go', text: '立即更新',
      onclick: function () {
        hideUpdateBar();
        setStatus('同步中…', 'busy');
        S.fetchPolicy(m.b).then(function () { toast('已更新到最新版本'); setStatus('就绪', ''); })
          .catch(function (e) { toast('同步失败：' + e.message, 'err'); setStatus('同步失败', 'err'); });
      }
    }));
    bar.appendChild(h('button', { class: 'later', text: '稍后', onclick: hideUpdateBar }));
    bar.hidden = false;
  }

  function hideUpdateBar() { dom.updateBar.hidden = true; }

  /* ---------------- 键盘 ---------------- */

  function moveSel(delta) {
    if (!state.results.length) return;
    var idx = state.results.findIndex(function (r) { return r.id === state.selId; });
    idx = idx < 0 ? (delta > 0 ? 0 : 0) : Math.max(0, Math.min(state.results.length - 1, idx + delta));
    select(state.results[idx].id, true);
    scrollToSel();
    paintWindow();
  }

  function bindKeys() {
    document.addEventListener('keydown', function (e) {
      var tag = (e.target.tagName || '').toLowerCase();
      var typing = tag === 'input' || tag === 'textarea' || e.target.isContentEditable;

      if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === 'k') {
        e.preventDefault(); App.ai.openOmni(); return;
      }
      if (typing) {
        if (e.key === 'Escape' && e.target === dom.input) { dom.input.blur(); }
        return;
      }
      if (e.key === '/') { e.preventDefault(); dom.input.focus(); dom.input.select(); return; }
      if (e.key === 'j' || e.key === 'ArrowDown') { e.preventDefault(); moveSel(1); return; }
      if (e.key === 'k' || e.key === 'ArrowUp') { e.preventDefault(); moveSel(-1); return; }
      if (e.key === 'Enter') {
        var it = currentItem();
        var url = it && U.safeUrl(it.u);
        if (url) window.open(url, '_blank', 'noopener');
        return;
      }
      if (e.key === 'Escape') { closeReader(); closePop(); return; }
      if (e.key === 's' && !e.metaKey) { S.check(true).then(function (ch) { if (!ch) toast('已是最新版本'); }); }
    });
  }

  /* ---------------- 启动 ---------------- */

  function cacheDom() {
    dom.dockScroll = document.getElementById('dockScroll');
    dom.dockTools = document.getElementById('dockTools');
    dom.yearline = document.getElementById('yearline');
    dom.input = document.getElementById('q');
    dom.count = document.getElementById('count');
    dom.crumb = document.getElementById('crumb');
    dom.sortBtn = document.getElementById('sortBtn');
    dom.favBtn = document.getElementById('favBtn');
    dom.vlist = document.getElementById('vlist');
    dom.vspacer = document.getElementById('vspacer');
    dom.vrows = document.getElementById('vrows');
    dom.listEmpty = document.getElementById('listEmpty');
    dom.reader = document.getElementById('reader');
    dom.scrim = document.getElementById('scrim');
    dom.toasts = document.getElementById('toasts');
    dom.themeBtn = document.getElementById('themeBtn');
    dom.syncPill = document.getElementById('syncPill');
    dom.syncRing = document.getElementById('syncRing');
    dom.syncState = document.getElementById('syncState');
    dom.syncTime = document.getElementById('syncTime');
    dom.updateBar = document.getElementById('updateBar');
    dom.stLeft = document.getElementById('stLeft');
    dom.stFresh = document.getElementById('stFresh');
    dom.stMid = document.getElementById('stMid');
  }

  function bindChrome() {
    dom.themeBtn.addEventListener('click', toggleTheme);
    dom.sortBtn.addEventListener('click', function () {
      state.sort = state.sort === 'rel' ? 'date' : 'rel';
      refresh();
    });
    dom.favBtn.addEventListener('click', function () {
      state.favOnly = !state.favOnly;
      renderDockTools();
      refresh();
    });
    dom.syncPill.addEventListener('click', function () {
      if (S.phase === 'error' || S.phase === 'offline') {
        S.check(true).then(function (ch) { if (ch) applyUpdate(); else toast('已是最新版本'); });
        return;
      }
      toast('正在检查更新…');
      S.check(true).then(function (ch) { if (!ch) toast('已是最新版本'); });
    });
    dom.input.addEventListener('input', U.debounce(function () {
      state.q = dom.input.value;
      refresh();
    }, 170));
    dom.input.addEventListener('keydown', function (e) {
      if (e.key === 'Enter') { e.preventDefault(); refresh(); }
      if (e.key === 'Escape') { dom.input.value = ''; state.q = ''; refresh(); }
    });
    dom.vlist.addEventListener('scroll', onScroll, { passive: true });
    dom.scrim.addEventListener('click', function () {
      closeReader();
      App.ai.closeAll();
    });
    window.addEventListener('resize', U.debounce(function () {
      readRowHeight();
      renderList();
      paintWindow(true);
    }, 160));
    setInterval(renderSync, 30000);
  }

  function applyUpdate() {
    if (state.scope === 'policy') {
      S.fetchPolicy(D.version).then(function () {
        toast('同步完成');
      }).catch(function (e) { toast('同步失败：' + e.message, 'err'); });
    } else {
      S.loadLib(true).then(function () { toast('知识库已更新'); })
        .catch(function (e) { toast('同步失败：' + e.message, 'err'); });
    }
  }

  function boot() {
    cacheDom();
    state.theme = App.store.get('tsq3.theme', null) ||
      (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'ink' : 'paper');
    applyTheme();
    readRowHeight();
    bindChrome();
    bindKeys();

    setStatus('启动中…', 'busy');
    buildDock();
    renderSync();

    S.on(function (type, payload) {
      if (type === 'state') renderSync();
      else if (type === 'progress') {
        if (payload.scope === 'policy') {
          dom.syncTime.textContent = Math.round(payload.p * 100) + '%';
        }
      } else if (type === 'data' || type === 'dataerror') {
        onData(payload);
      } else if (type === 'manifest') {
        onManifest(payload);
      }
    });

    // 先渲染骨架
    for (var i = 0; i < 6; i++) {
      dom.vrows.appendChild(h('div', { class: 'sk-row' }, [
        h('div', { class: 'skel sk-bar', style: 'width:' + (46 + i * 6) + '%' }),
        h('div', { class: 'skel sk-bar', style: 'width:22%;margin-left:auto' })
      ]));
    }
    dom.vspacer.style.height = '380px';

    var bodyEl = document.body || {};
    var ds = bodyEl.dataset || {};
    var dataUrl = ds.dataUrl || 'data.json.gz';
    App.data.init({
      base: window.__TS_BASE || '',
      dataFile: dataUrl,
      libFile: (dataUrl.indexOf('data') === 0 ? dataUrl.replace(/^data/, 'library') : 'library.json.gz'),
      clientSafe: ds.clientSafe === '1'
    });
    if (App.data.clientSafe) document.documentElement.setAttribute('data-safe', '1');

    S.check(true)
      .then(function () { return S.loadPolicy(); })
      .then(function () {
        if (!D.policy) throw new Error('数据为空');
        dom.vrows.innerHTML = '';
        buildDock();
        renderYearline();
        setStatus('就绪', '');
        dom.stLeft.appendChild(document.createTextNode(
          ' · ' + U.fmt(D.policy.d.length) + ' 份 · 合并 ' + U.fmt((D.policy.m || {}).mg || 0) + ' 条'));
        return refresh();
      })
      .then(function () {
        S.start();
        renderReader();

  /* ---------------- AI 顾问 ---------------- */

  var ai = { el: null, body: null, input: null, send: null, hits: [], busy: false, ctrl: null };

  function buildAI() {
    var body = h('div', { class: 'ai-body' });
    var input = h('textarea', { placeholder: '追问…（Enter 发送，Shift+Enter 换行）', rows: '1' });
    var send = h('button', { class: 'send', text: '发送' });
    var el = h('div', { class: 'ai-drawer', role: 'dialog', 'aria-label': 'AI 顾问', hidden: 'hidden' }, [
      h('div', { class: 'ai-head' }, [
        h('span', {}, svgIcon('M12 3l1.9 4.6L18.5 9.5 13.9 11.4 12 16l-1.9-4.6L5.5 9.5l4.6-1.9z', 16)),
        h('span', { class: 'ttl', text: 'AI 顾问' }),

  function openAI(question, hits) {
    if (clientSafe()) {
      if (!ai.el) buildAI();

        text: '客户安全版：本站不向任何外部服务发送内容，AI 问答已停用。全部检索与阅读功能不受影响。' }));

    }

  function closeAI() {

      App.ui.dom.scrim.hidden = true;

  function submitAI() {
    var q = ai.input.value.trim();

  function resolveHits(question) {
    if (ai.hits && ai.hits.length) return Promise.resolve(ai.hits.slice(0, 6));
    var scope = App.ui.state.scope;
    return Q.ensure(scope, D.dataset(scope)).then(function () {
      var res = Q.run(scope, question, { filters: {}, sort: 'rel' });
      return res.items.slice(0, 6);
    });
  }

  function brief(it) {
    var t = it.s || it.kk || '';
    t = String(t).replace(/\s+/g, ' ').trim();
    return t.length > 120 ? t.slice(0, 120) + '…' : t;
  }

  function buildPrompt(question, hits) {
    var lines = [];
    var today = U.today();
    var maxd = (D.policy && D.policy.m && (D.policy.m.source_maxd || D.policy.m.maxd)) || '未知';
    lines.push('今天是 ' + today + '。资料库为离线快照，数据截至 ' + maxd + '。');
    lines.push('');
    lines.push('【用户问题】');
    lines.push(question);
    lines.push('');
    lines.push('【政策资料】（编号仅本次回答有效）');
    hits.forEach(function (it, i) {
      var info = [];
      if (it.n) info.push('文号：' + it.n);
      if (it.d) info.push('发布：' + it.d);
      if (it.w) info.push('效力：' + it.w);
      if (it.x) info.push('税种：' + it.x);
      lines.push('[' + (i + 1) + '] ' + it.t);
      if (info.length) lines.push(info.join('｜'));
      if (it.s) lines.push('摘要：' + brief(it));
      else if (it.kk) lines.push('摘录：' + String(it.kk).replace(/\s+/g, ' ').slice(0, 260));
    });
    lines.push('');
    lines.push('【回答要求】');
    lines.push('1. 先写「结论」：2-4 句，直接回答（能/不能、多少、怎么办）。');
    lines.push('2. 再写「依据」：逐条列出，每条以 [编号] 开头，引用原话用「」括起。');
    lines.push('3. 只能引用上面出现过的编号；资料中没有的文号、条款号、税率、期限、金额一律不得写入。');
    lines.push('4. 资料不足时明确写「现有资料不足以判断」，并说明还需要哪类文件。');
    lines.push('5. 多份资料口径不一致时指出差异，并说明以哪份为准（优先「全文有效」且发布更晚者）。');
    lines.push('6. 不使用 Markdown 表格；总字数不超过 500 字。');
    lines.push('7. 最后单独一行：以上为政策检索结果，具体适用请以主管税务机关口径为准。');
    return lines.join('\n');
  }

  function mapError(status, detail) {
    if (status === 401 || status === 403) return 'Key 无效或未开通该模型';
    if (status === 404) return '模型名不存在，请在设置里核对';
    if (status === 429) return '请求过于频繁，请稍后再试';
    if (status >= 500) return '服务端暂时不可用（HTTP ' + status + '）';
    return '调用失败（HTTP ' + status + '）' + (detail ? '：' + String(detail).slice(0, 80) : '');
  }

  function runAsk(question) {
    clearEl(ai.body);
    var qBox = h('div', { class: 'ai-q' }, [h('b', { text: '问题：' }), document.createTextNode(question)]);
    var refs = h('div', { class: 'ai-refs' });
    var ans = h('div', { class: 'ai-ans' });
    ai.body.appendChild(qBox);
    ai.body.appendChild(refs);
    ai.body.appendChild(ans);

    ai.busy = true;
    ai.busy = true;
    ai.send.disabled = true;
    ans.innerHTML = '';
    var cur = h('span', { class: 'cur' });
    ans.appendChild(cur);

    resolveHits(question).then(function (hits) {
      ai.hits = hits;
      if (!hits.length) {
        ans.textContent = '没有检索到可以引用的资料，无法作答。建议换更具体的关键词，如税种 + 事项。';
        return;
      }
      hits.forEach(function (it, i) {
        refs.appendChild(h('button', {
          class: 'ai-ref', title: it.t,
          onclick: function () { App.ui.jumpTo(it.id); closeAI(); }
        }, '[' + (i + 1) + '] ' + (it.n || it.t)));
      });

      if (!cfg.key) {
        clearEl(ans);
        ans.appendChild(h('div', { class: 'ai-warn',
          text: '已找到 ' + hits.length + ' 份可引用资料，但尚未配置 API Key。填入 Key 后即可生成带引用的回答；Key 默认只保存在本次会话。' }));
        ai.body.appendChild(h('button', { class: 'mini-btn primary', text: '去设置', style: 'margin-top:10px', onclick: openSettings }));
        return;
      }

      var full = '';
      ai.ctrl = typeof AbortController !== 'undefined' ? new AbortController() : null;
      return streamAI(question, hits, ai.ctrl, function (delta, text) {
        full = text;
        cur.textContent = text;
        ai.body.scrollTop = ai.body.scrollHeight;
      }).then(function (text) {
        renderAnswer(ans, text || full, hits);
        var check = validateNumbers(text || full, hits);
        if (check.unsupported.length) {
          ai.body.appendChild(h('div', { class: 'ai-warn',
            text: '核对提示：以下数值未在引用资料中直接出现，请人工复核 —— ' + check.unsupported.slice(0, 6).join('、') }));
        }
      });
    }).catch(function (e) {
      ans.textContent = '';
      ai.body.appendChild(h('div', { class: 'ai-warn', text: (e && e.message) || '调用失败' }));
    }).then(function () {
      ai.busy = false;
      ai.send.disabled = false;
      ai.ctrl = null;
    });
  }

  function streamAI(question, hits, ctrl, onDelta) {
    var base = (cfg.base || AI_DEFAULT_BASE).replace(/\/+$/, '');
    if (!hostAllowed(base)) return Promise.reject(new Error('接口地址不在白名单，已拒绝发送 Key'));
    var body = {
      model: cfg.model || AI_DEFAULT_MODEL,
      messages: [
        { role: 'system', content: SYSTEM },
        { role: 'user', content: buildPrompt(question, hits) }
      ],
      max_tokens: 1200,
      temperature: 0.2,
      stream: true
    };
    var req = {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + cfg.key },
      body: JSON.stringify(body)
    };
    if (ctrl) req.signal = ctrl.signal;

    return fetch(base + '/chat/completions', req).then(function (res) {
      if (!res.ok) {
        return res.text().then(function (t) { throw new Error(mapError(res.status, t)); },
          function () { throw new Error(mapError(res.status, '')); });
      }
      if (!res.body || !res.body.getReader) {
        throw new Error('当前浏览器不支持流式响应，请升级浏览器');
      }
      var reader = res.body.getReader();
      var dec = new TextDecoder('utf-8');
      var buf = '', text = '';

      return (function pump() {
        return reader.read().then(function (r) {
          if (r.done) return text;
          buf += dec.decode(r.value, { stream: true });
          var lines = buf.split('\n');
          buf = lines.pop();
          for (var i = 0; i < lines.length; i++) {
            var line = lines[i].trim();
            if (line.indexOf('data:') !== 0) continue;
            var data = line.slice(5).trim();
            if (!data || data === '[DONE]') continue;
            try {
              var j = JSON.parse(data);
              var piece = j.choices && j.choices[0] && j.choices[0].delta && j.choices[0].delta.content;
              if (piece) { text += piece; onDelta(piece, text); }
            } catch (e) { /* 心跳行或半包，跳过 */ }
          }
          return pump();
        });
      })();
    }).catch(function (e) {
      if (e && e.name === 'AbortError') throw new Error('已取消');
      if (e instanceof TypeError) throw new Error('网络被拦截（可能是公司网络或浏览器插件）');
      throw e;
    });
  }

  function renderAnswer(box, text, hits) {
    clearEl(box);
    var re = /\[(\d{1,2})\]/g, last = 0, m;
    while ((m = re.exec(text)) !== null) {
      if (m.index > last) box.appendChild(document.createTextNode(text.slice(last, m.index)));
      var n = Number(m[1]);
      var it = hits[n - 1];
      if (it) {
        box.appendChild(h('button', {
          class: 'ai-ref', style: 'margin:0 2px;vertical-align:1px', text: '[' + n + ']',
          title: it.t,
          onclick: function () { App.ui.jumpTo(it.id); closeAI(); }
        }));
      } else {
        box.appendChild(document.createTextNode(m[0]));
      }
      last = m.index + m[0].length;
    }
    if (last < text.length) box.appendChild(document.createTextNode(text.slice(last)));
  }

  /** 数字核对：百分比 / 金额 / 完整日期 必须在引用原文中出现过（带边界，避免 5% 命中 15%）。 */
  function validateNumbers(text, hits) {
    var src = hits.map(function (it) {
      return [it.t, it.n, it.d, it.ws, it.s, it.kk].filter(Boolean).join('\n');
    }).join('\n').replace(/\s+/g, '');
    var clean = String(text || '').replace(/\[\d{1,2}\]/g, ' ');
    var pats = [/\d+(?:\.\d+)?%/g, /\d{4}年\d{1,2}月\d{1,2}日/g, /\d{4}-\d{1,2}-\d{1,2}/g,
      /\d+(?:\.\d+)?\s*(?:亿元|万元|元)/g];
    var seen = Object.create(null), bad = [];
    pats.forEach(function (re) {
      var m;
      while ((m = re.exec(clean)) !== null) {
        var tok = m[0].replace(/\s+/g, '');
        if (seen[tok]) continue;
        seen[tok] = 1;
        var safe = U.escapeRe(tok);
        var rex = new RegExp('(^|[^0-9.])' + safe + '($|[^0-9%])');
        if (!rex.test(src)) bad.push(tok);
      }
    });
    return { unsupported: bad };
  }

  /* ---------------- 设置 ---------------- */

  var sheet = null;

  function openSettings() {
    if (sheet) sheet.remove();
    loadCfg();

    var keyInput = h('input', { type: 'password', value: cfg.key, placeholder: 'ARK API Key（sk-…）', autocomplete: 'off' });
    var baseInput = h('input', { type: 'text', value: cfg.base });
    var modelInput = h('input', { type: 'text', value: cfg.model });
    var remember = h('input', { type: 'checkbox', checked: cfg.remember ? 'checked' : null });

    sheet = h('div', { class: 'sheet', role: 'dialog', 'aria-label': '设置' }, [
      h('div', { class: 'sheet-hd' }, [
        h('b', { text: '设置' }),
        h('span', { class: 'sp' }),
        h('button', { class: 'icon-btn', onclick: closeSheet, 'aria-label': '关闭' }, '×')
      ]),
      h('div', { class: 'sheet-bd' }, [
        clientSafe() ? h('div', { class: 'field' }, [
          h('div', { class: 'ai-warn', text: '客户安全版：不接收、不保存、不外发任何密钥，AI 相关配置已移除。' })
        ]) : h('div', { class: 'field' }, [
          h('label', { text: 'ARK API Key' }), keyInput,
          h('div', { class: 'hint', text: '仅存于本机。默认写入 sessionStorage（关标签页即失效）；勾选「记住」才写入 localStorage。' }),
          h('div', { class: 'field row', style: 'margin-top:8px' }, [
            remember, h('label', { text: '记住 Key', style: 'margin:0' })
          ])
        ]),
        clientSafe() ? null : h('div', { class: 'field' }, [
          h('label', { text: '接口地址（仅允许白名单域名）' }), baseInput
        ]),
        clientSafe() ? null : h('div', { class: 'field' }, [
          h('label', { text: '模型名称' }), modelInput
        ]),
        h('div', { class: 'field' }, [
          h('label', { text: '数据自动同步' }),
          h('label', { class: 'switch' }, [
            h('input', {
              type: 'checkbox',
              checked: App.store.get('tsq3.autosync', true) !== false ? 'checked' : null,
              onchange: function (e) {
                App.store.set('tsq3.autosync', !!e.target.checked);
                toast(e.target.checked ? '已开启自动同步' : '已关闭自动同步，发现新版本时会提示你手动确认');
              }
            }),
            h('span', { text: '发现新版本时后台静默拉取并热替换（关闭后改为底部提示条）' })
          ]),
          h('select', {
            onchange: function (e) { App.sync.pollMs = Number(e.target.value); App.sync.nextAt = Date.now() + App.sync.pollMs; }
          }, [
            h('option', { value: '120000', text: '每 2 分钟检查一次' }),
            h('option', { value: '300000', selected: 'selected', text: '每 5 分钟检查一次（默认）' }),
            h('option', { value: '900000', text: '每 15 分钟检查一次' }),
            h('option', { value: '3600000', text: '每 60 分钟检查一次' })
          ]),
          h('div', { class: 'hint', text: '切回标签页时立即检查；发现新版本会在后台拉取并热替换，无需刷新页面。' })
        ]),
        h('div', { class: 'field' }, [
          h('label', { text: '本地缓存' }),
          h('button', {
            class: 'btn', text: '清空并重新载入',
            onclick: function () {
              Promise.all([
                App.idb.asset.put('policy', null),
                App.idb.asset.put('library', null)
              ]).then(function () { location.reload(); });
            }
          }),
          h('div', { class: 'hint', text: '缓存版本：' + (D.version || '—') + ' · 记录数：' +
            U.fmt(D.policy ? D.policy.d.length : 0) })
        ])
      ]),
      h('div', { class: 'sheet-ft' }, [
        h('button', { class: 'btn', text: '取消', onclick: closeSheet }),
        h('button', {
          class: 'btn primary', text: '保存',
          onclick: function () {
            if (clientSafe()) {
              App.store.set('tsq3.autosync', App.store.get('tsq3.autosync', true));
              closeSheet();
              toast('设置已保存');
              return;
            }
            cfg.key = keyInput.value.trim();
            cfg.base = baseInput.value.trim() || AI_DEFAULT_BASE;
            cfg.model = modelInput.value.trim() || AI_DEFAULT_MODEL;
            cfg.remember = !!remember.checked;
            if (!hostAllowed(cfg.base)) { toast('接口地址必须是 https://ark.cn-beijing.volces.com', 'err'); return; }
            saveKey();
            App.store.set('tsq3.base', cfg.base);
            App.store.set('tsq3.model', cfg.model);
            App.store.set('tsq3.remember', cfg.remember);
            if (ai.el) ai.el.querySelector('.mdl').textContent = cfg.model;
            closeSheet();
            toast('设置已保存');
          }
        })
      ])
    ]);

    document.body.appendChild(sheet);
    App.ui.dom.scrim.hidden = false;
    App.ui.dom.scrim.dataset.for = 'settings';
    document.body.classList.add('no-scroll');
    setTimeout(function () { keyInput.focus(); }, 30);
  }

  function closeSheet() {
    if (sheet) { sheet.remove(); sheet = null; }
    if (App.ui.dom.scrim.dataset.for === 'settings') {
      App.ui.dom.scrim.hidden = true;
      App.ui.dom.scrim.dataset.for = '';
      document.body.classList.remove('no-scroll');
    }
  }

  function closeAll() {
    closeOmni(); closeAI(); closeSheet();
  }

  /* ---------------- 启动绑定 ---------------- */

  function init() {
    h = function (tag, props, kids) { return App.ui.h(tag, props, kids); };
    clearEl = function (el) { while (el.firstChild) el.removeChild(el.firstChild); };
    toast = App.ui.toast;
    svgIcon = App.ui.svgIcon;

    loadCfg();
    document.getElementById('omniTrigger').addEventListener('click', openOmni);
    document.getElementById('settingsBtn').addEventListener('click', openSettings);
    document.addEventListener('click', function (e) {
      if (e.target && e.target.id === 'scrim') closeAll();
    });
    document.addEventListener('keydown', function (e) {
      if (e.key === 'Escape') { closeOmni(); closeSheet(); if (ai.el && !ai.el.hidden) closeAI(); }
    });
  }

  var svgIcon = null;

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', init);
  } else {
    init();
  }

  App.ai = {
    open: openAI,
    openOmni: openOmni,
    closeAll: closeAll,
    settings: openSettings,
    cfg: cfg
  };

})();
</script>
</body>
</html>

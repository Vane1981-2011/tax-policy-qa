<title>税务政策目录检索 · 税策智库工作台</title>
<style>/* 税策智库 · 桌面式政策检索工作台 —— 设计系统与版式 */
/* ============================================================
   税策智库 · 设计系统基础层
   纸/墨双模 · 黑体界面 + 宋体阅读 · 印泥朱作标记色
   ============================================================ */

*, *::before, *::after { box-sizing: border-box; }

:root {
  --font-ui: -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB",
             "Microsoft YaHei", "Source Han Sans SC", sans-serif;
  --font-serif: "Songti SC", "Source Han Serif SC", "Noto Serif CJK SC", STSong, SimSun, serif;
  --font-mono: "SF Mono", ui-monospace, "JetBrains Mono", Menlo, Consolas, monospace;

  --bg: #F1F2F4;
  --surface: #FFFFFF;
  --surface-2: #F7F8F9;
  --surface-3: #ECEEF1;
  --ink: #12171C;
  --ink-2: #4A5562;
  --ink-3: #66717E;
  --ink-4: #8A939E;
  --line: #E1E4E8;
  --line-2: #EDEFF2;
  --brand: #B23A2F;
  --brand-2: #D25649;
  --brand-soft: #FBEEEB;
  --jade: #1E6F62;
  --jade-soft: #E6F2EF;
  --amber: #A2701A;
  --amber-soft: #FAF2E1;
  --slate-soft: #EFF1F4;

  --radius: 10px;
  --radius-sm: 7px;
  --radius-xs: 5px;

  --bar-h: 56px;
  --dock-h: 46px;
  --status-h: 30px;
  --reader-w: clamp(360px, 32.5vw, 520px);
  --row-h: 74px;

  --shadow-1: 0 1px 2px rgba(16, 24, 40, .05);
  --shadow-2: 0 8px 28px rgba(16, 24, 40, .10);
  --shadow-3: 0 28px 72px rgba(16, 24, 40, .20);
  --shadow-in: inset 0 0 0 1px var(--line);

  --ease: cubic-bezier(.22, .61, .36, 1);
  color-scheme: light;
}

[data-theme="ink"] {
  --bg: #0D1013;
  --surface: #141A1F;
  --surface-2: #1A2127;
  --surface-3: #222A32;
  --ink: #E9EEF3;
  --ink-2: #B0BBC7;
  --ink-3: #93A0AD;
  --ink-4: #6F7B88;
  --line: #242C34;
  --line-2: #1D252C;
  --brand: #E56B5C;
  --brand-2: #F0806F;
  --brand-soft: #2A1917;
  --jade: #6AC7B5;
  --jade-soft: #122824;
  --amber: #DFAF62;
  --amber-soft: #2A2317;
  --slate-soft: #1C242B;
  --shadow-1: 0 1px 2px rgba(0, 0, 0, .5);
  --shadow-2: 0 10px 30px rgba(0, 0, 0, .55);
  --shadow-3: 0 28px 72px rgba(0, 0, 0, .7);
  color-scheme: dark;
}

html, body { height: 100%; overflow: hidden; }

body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font-family: var(--font-ui);
  font-size: 14px;
  line-height: 1.55;
  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
  font-variant-numeric: tabular-nums;
}

body.no-scroll { overflow: hidden; }

::selection { background: var(--brand-soft); color: var(--brand); }

:focus-visible {
  outline: 2px solid var(--brand);
  outline-offset: 2px;
  border-radius: 4px;
}

button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; background: none; border: 0; padding: 0; }

mark {
  background: linear-gradient(180deg, transparent 58%, var(--brand-soft) 58%);
  color: var(--brand);
  font-style: normal;
  font-weight: 600;
  padding: 0 1px;
}

.app {
  height: 100dvh;
  display: flex;
  flex-direction: column;
  padding-bottom: var(--status-h);
}
@supports not (height: 100dvh) { .app { height: 100vh; } }

/* ---------------- 顶栏 ---------------- */

.bar {
  flex: 0 0 auto;
  position: sticky;
  top: 0;
  z-index: 60;
  height: var(--bar-h);
  display: flex;
  align-items: center;
  gap: 18px;
  padding: 0 18px;
  background: var(--surface);
  background: color-mix(in srgb, var(--surface) 86%, transparent);
  backdrop-filter: saturate(1.6) blur(14px);
  -webkit-backdrop-filter: saturate(1.6) blur(14px);
  border-bottom: 1px solid var(--line);
}

.brand {
  display: flex;
  align-items: center;
  gap: 10px;
  text-decoration: none;
  color: inherit;
  flex: 0 0 auto;
}

.seal {
  width: 30px;
  height: 30px;
  display: grid;
  place-items: center;
  border-radius: 8px;
  background: var(--brand);
  color: #fff;
  font-family: var(--font-serif);
  font-size: 17px;
  font-weight: 700;
  letter-spacing: 0;
  box-shadow: inset 0 0 0 1.5px rgba(255, 255, 255, .28);
}

.brand-txt { display: flex; flex-direction: column; line-height: 1.15; }
.brand-txt b { font-size: 15px; letter-spacing: .2px; }
.brand-txt i {
  font-style: normal;
  font-family: var(--font-mono);
  font-size: 9px;
  letter-spacing: .13em;
  color: var(--ink-4);
  margin-top: 2px;
}

.omni-trigger {
  flex: 1 1 auto;
  max-width: 560px;
  height: 34px;
  display: flex;
  align-items: center;
  gap: 9px;
  padding: 0 10px 0 11px;
  border-radius: var(--radius-sm);
  border: 1px solid var(--line);
  background: var(--surface-2);
  color: var(--ink-3);
  font-size: 13px;
  transition: border-color .16s var(--ease), background .16s var(--ease), box-shadow .16s var(--ease);
}
.omni-trigger:hover { border-color: var(--ink-4); background: var(--surface); }
.omni-trigger:focus-visible { box-shadow: var(--ring); outline: none; border-color: var(--brand); }
.omni-trigger svg { flex: 0 0 auto; color: var(--ink-4); }
.omni-trigger span { flex: 1 1 auto; text-align: left; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
.omni-trigger kbd {
  font-family: var(--font-mono);
  font-size: 10px;
  padding: 2px 5px;
  border-radius: 4px;
  border: 1px solid var(--line);
  background: var(--surface);
  color: var(--ink-4);
}

.bar-actions { display: flex; align-items: center; gap: 6px; flex: 0 0 auto; margin-left: auto; }

.sync-pill {
  display: flex;
  align-items: center;
  gap: 8px;
  height: 34px;
  padding: 0 10px 0 6px;
  border-radius: 999px;
  border: 1px solid var(--line);
  background: var(--surface);
  transition: border-color .16s var(--ease), background .16s var(--ease);
}
.sync-pill:hover { border-color: var(--ink-4); }
.sync-pill .ring { position: relative; width: 22px; height: 22px; display: grid; place-items: center; }
.sync-pill .ring svg { transform: rotate(-90deg); display: block; }
.sync-pill .ring circle { fill: none; stroke-width: 2.4; }
.sync-pill .ring .trk { stroke: var(--line); }
.sync-pill .ring .val { stroke: var(--jade); stroke-linecap: round; transition: stroke-dashoffset .6s var(--ease), stroke .3s; }
.sync-pill[data-state="checking"] .ring .val { stroke: var(--amber); }
.sync-pill[data-state="updating"] .ring .val { stroke: var(--brand); }
.sync-pill[data-state="error"] .ring .val { stroke: var(--brand-2); }
.sync-pill .dot {
  position: absolute; inset: 0; margin: auto; width: 5px; height: 5px; border-radius: 50%;
  background: var(--jade);
}
.sync-pill[data-state="checking"] .dot { background: var(--amber); animation: pulse 1.4s ease-in-out infinite; }
.sync-pill[data-state="updating"] .dot { background: var(--brand); animation: pulse .9s ease-in-out infinite; }
.sync-pill[data-state="error"] .dot { background: var(--brand-2); }

.sync-txt { display: flex; flex-direction: column; line-height: 1.2; }
.sync-txt b { font-size: 11.5px; font-weight: 600; }
.sync-txt i { font-style: normal; font-size: 10px; color: var(--ink-4); font-family: var(--font-mono); }

@keyframes pulse { 0%, 100% { opacity: 1; transform: scale(1); } 50% { opacity: .35; transform: scale(.72); } }

.icon-btn {
  width: 34px; height: 34px;
  display: grid; place-items: center;
  border-radius: var(--radius-sm);
  border: 1px solid transparent;
  color: var(--ink-2);
  transition: background .16s, color .16s, border-color .16s;
}
.icon-btn:hover { background: var(--surface-2); border-color: var(--line); color: var(--ink); }
.icon-btn[aria-pressed="true"] { background: var(--surface-2); border-color: var(--line); color: var(--brand); }

/* ---------------- 内容体系 Dock ---------------- */

.dock {
  flex: 0 0 auto;
  position: sticky;
  top: var(--bar-h);
  z-index: 55;
  height: var(--dock-h);
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 0 18px;
  background: var(--surface);
  border-bottom: 1px solid var(--line);
}

.dock-scroll {
  display: flex;
  align-items: center;
  gap: 2px;
  overflow-x: auto;
  scrollbar-width: none;
  max-width: 100%;
}
.dock-scroll::-webkit-scrollbar { display: none; }

.dock-tab {
  position: relative;
  height: 30px;
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 0 9px;
  border-radius: var(--radius-xs);
  color: var(--ink-3);
  font-size: 13px;
  white-space: nowrap;
  transition: color .14s, background .14s;
}
.dock-tab em {
  font-style: normal;
  font-family: var(--font-mono);
  font-size: 10px;
  color: var(--ink-4);
  letter-spacing: -.02em;
}
.dock-tab:hover { color: var(--ink); background: var(--surface-2); }
.dock-tab[aria-selected="true"] { color: var(--ink); font-weight: 600; }
.dock-tab[aria-selected="true"]::after {
  content: "";
  position: absolute;
  left: 9px; right: 9px; bottom: -8px;
  height: 2px;
  background: var(--brand);
  border-radius: 2px;
}
.dock-tab[aria-selected="true"] em { color: var(--brand); }

.dock-tools {
  margin-left: auto;
  display: flex;
  align-items: center;
  gap: 4px;
  padding-left: 12px;
  border-left: 1px solid var(--line-2);
}

.chip-btn {
  height: 28px;
  display: inline-flex;
  align-items: center;
  gap: 5px;
  padding: 0 9px;
  border-radius: 999px;
  border: 1px solid var(--line);
  background: var(--surface);
  color: var(--ink-2);
  font-size: 12px;
  white-space: nowrap;
  transition: border-color .14s, background .14s, color .14s;
}
.chip-btn:hover { border-color: var(--ink-4); color: var(--ink); }
.chip-btn .cnt { font-family: var(--font-mono); font-size: 10px; color: var(--ink-4); }
.chip-btn[data-on="1"] {
  background: var(--ink);
  border-color: var(--ink);
  color: var(--surface);
}
.chip-btn[data-on="1"] .cnt { color: rgba(255, 255, 255, .7); }
.chip-btn .x { font-size: 13px; line-height: 1; opacity: .6; }

/* ---------------- 档案年轮 ---------------- */

.yearline {
  flex: 0 0 auto;
  display: flex;
  align-items: flex-end;
  gap: 3px;
  height: 58px;
  padding: 8px 18px 0;
  background: var(--surface);
  border-bottom: 1px solid var(--line);
  overflow-x: auto;
  scrollbar-width: none;
}
.yearline::-webkit-scrollbar { display: none; }
.yearline[hidden] { display: none; }

.yr {
  position: relative;
  flex: 1 1 0;
  min-width: 14px;
  display: flex;
  flex-direction: column;
  justify-content: flex-end;
  align-items: center;
  gap: 3px;
  padding-bottom: 4px;
  color: var(--ink-4);
  font-family: var(--font-mono);
  font-size: 9px;
  letter-spacing: -.02em;
  transition: color .14s;
}
.yr .bar {
  width: 100%;
  max-width: 34px;
  border-radius: 3px 3px 2px 2px;
  background: var(--surface-3);
  transition: background .18s var(--ease), height .3s var(--ease);
}
.yr:hover { color: var(--ink-2); }
.yr:hover .bar { background: var(--ink-4); }
.yr[data-on="1"] { color: var(--brand); font-weight: 700; }
.yr[data-on="1"] .bar { background: var(--brand); }
.yr .n { position: absolute; top: -1px; font-size: 9px; opacity: 0; transition: opacity .14s; }
.yr:hover .n { opacity: 1; }

/* ---------------- 工作台（列表 + 阅读窗） ---------------- */

.bench {
  flex: 1 1 0;
  display: grid;
  grid-template-columns: minmax(0, 1fr) var(--reader-w);
  min-height: 0;
  overflow: hidden;
}

.pane-list {
  min-width: 0;
  min-height: 0;
  height: 100%;
  display: flex;
  flex-direction: column;
  border-right: 1px solid var(--line);
}

.list-head {
  position: relative;
  z-index: 20;
  flex: 0 0 auto;
  height: 40px;
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 0 16px;
  background: var(--bg);
  background: color-mix(in srgb, var(--bg) 92%, transparent);
  backdrop-filter: blur(8px);
  -webkit-backdrop-filter: blur(8px);
  border-bottom: 1px solid var(--line-2);
}

.list-head .count { font-size: 12.5px; color: var(--ink-2); }
.list-head .count b { font-family: var(--font-mono); color: var(--ink); font-size: 13px; }
.list-head .crumb {
  font-size: 11.5px;
  color: var(--ink-4);
  display: flex; gap: 6px; align-items: center;
  overflow: hidden; white-space: nowrap; text-overflow: ellipsis;
}
.list-head-actions { margin-left: auto; display: flex; align-items: center; gap: 4px; }

.ghost-btn {
  height: 26px;
  padding: 0 8px;
  border-radius: var(--radius-xs);
  font-size: 11.5px;
  color: var(--ink-3);
  display: inline-flex; align-items: center; gap: 4px;
  transition: background .14s, color .14s;
}
.ghost-btn:hover { background: var(--surface-3); color: var(--ink); }
.ghost-btn[data-on="1"] { color: var(--brand); background: var(--brand-soft); }

/* 虚拟列表 */

.vlist {
  position: relative;
  flex: 1 1 auto;
  overflow-y: auto;
  overscroll-behavior: contain;
  will-change: transform;
}
.vspacer { width: 1px; }
.vrows { position: absolute; top: 0; left: 0; right: 0; }

.row {
  position: absolute;
  height: var(--row-h);
  left: 0; right: 0;
  display: grid;
  grid-template-columns: 3px minmax(0, 1fr) auto;
  gap: 12px;
  align-items: center;
  padding: 0 16px 0 0;
  border-bottom: 1px solid var(--line-2);
  background: var(--surface);
  cursor: pointer;
  transition: background .12s;
}
.row::before {
  content: "";
  align-self: stretch;
  background: transparent;
  transition: background .12s;
}
.row:hover { background: var(--surface-2); }
.row:hover::before { background: var(--ink-4); }
.row[aria-selected="true"] { background: var(--brand-soft); }
.row[aria-selected="true"]::before { background: var(--brand); }
.row[data-fresh="1"] .r-date { color: var(--brand); }

.r-main { min-width: 0; padding: 9px 0; }
.r-title {
  font-size: 13.5px;
  line-height: 1.42;
  font-weight: 500;
  color: var(--ink);
  display: -webkit-box;
  -webkit-line-clamp: 2;
  -webkit-box-orient: vertical;
  overflow: hidden;
  letter-spacing: .1px;
}
.r-title .q { color: var(--ink-3); font-weight: 400; }
.r-meta {
  margin-top: 4px;
  display: flex;
  align-items: center;
  gap: 7px;
  font-size: 11px;
  color: var(--ink-4);
  overflow: hidden;
  white-space: nowrap;
}
.r-meta .m { overflow: hidden; text-overflow: ellipsis; }
.r-meta .sep { color: var(--line); }
.r-no {
  font-family: var(--font-mono);
  font-size: 10.5px;
  color: var(--ink-3);
  background: var(--surface-3);
  padding: 1px 5px;
  border-radius: 3px;
  flex: 0 0 auto;
}

.r-side {
  display: flex;
  flex-direction: column;
  align-items: flex-end;
  gap: 5px;
  flex: 0 0 auto;
}
.r-date { font-family: var(--font-mono); font-size: 10.5px; color: var(--ink-3); letter-spacing: -.02em; }
.r-meta { color: var(--ink-3); }

.pill {
  font-size: 10px;
  line-height: 1;
  padding: 3px 5px;
  border-radius: 3px;
  border: 1px solid transparent;
  white-space: nowrap;
}
.pill.ok { color: var(--jade); background: var(--jade-soft); }
.pill.dead { color: var(--ink-4); background: var(--surface-3); }
.pill.part { color: var(--amber); background: var(--amber-soft); }
.pill.na { color: var(--ink-4); background: transparent; border-color: var(--line); }

.rel {
  width: 26px; height: 26px;
  display: grid; place-items: center;
  position: relative;
}
.rel svg { transform: rotate(-90deg); display: block; }
.rel circle { fill: none; stroke-width: 2; }
.rel .trk { stroke: var(--line); }
.rel .val { stroke: var(--brand); stroke-linecap: round; }
.rel span { position: absolute; font-family: var(--font-mono); font-size: 8px; color: var(--ink-4); }

.list-empty {
  padding: 64px 24px;
  text-align: center;
  color: var(--ink-3);
}
.list-empty b { display: block; color: var(--ink); font-size: 15px; margin-bottom: 6px; }
.list-empty p { margin: 0 0 14px; font-size: 12.5px; }

/* ---------------- 状态栏 ---------------- */

.statusbar {
  position: fixed;
  left: 0; right: 0; bottom: 0;
  z-index: 50;
  height: var(--status-h);
  display: flex;
  align-items: center;
  gap: 14px;
  padding: 0 14px;
  background: var(--surface);
  border-top: 1px solid var(--line);
  font-family: var(--font-mono);
  font-size: 10.5px;
  color: var(--ink-4);
  letter-spacing: -.01em;
}
.statusbar .grow { flex: 1 1 auto; }
.statusbar b { color: var(--ink-2); font-weight: 500; }
.statusbar .sep { width: 1px; height: 12px; background: var(--line); }
.statusbar .copyright { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.statusbar #stLeft, .statusbar #stMid, .statusbar #stFresh { white-space: nowrap; }
.statusbar .ind { display: inline-flex; align-items: center; gap: 5px; }
.statusbar .led { width: 6px; height: 6px; border-radius: 50%; background: var(--jade); }
.statusbar .led.busy { background: var(--amber); animation: pulse 1.2s infinite; }
.statusbar .led.err { background: var(--brand-2); }


/* ===== 阅读窗 / 浮层 / 响应式 ===== */
/* ============================================================
   阅读窗 / 指令台 / AI 顾问 / 设置 / 提示
   ============================================================ */

.pane-reader {
  position: relative;
  height: 100%;
  min-height: 0;
  overflow: hidden auto;
  overscroll-behavior: contain;
  background: var(--surface);
  scrollbar-width: thin;
  scrollbar-color: var(--line) transparent;
}
.pane-reader::-webkit-scrollbar { width: 8px; }
.pane-reader::-webkit-scrollbar-thumb { background: var(--line); border-radius: 4px; border: 2px solid var(--surface); }

.rd-head {
  position: sticky;
  top: 0;
  z-index: 5;
  display: flex;
  align-items: center;
  gap: 6px;
  padding: 9px 14px;
  background: var(--surface);
  background: color-mix(in srgb, var(--surface) 92%, transparent);
  backdrop-filter: blur(10px);
  -webkit-backdrop-filter: blur(10px);
  border-bottom: 1px solid var(--line-2);
}
.rd-head .tag {
  font-family: var(--font-mono);
  font-size: 9.5px;
  letter-spacing: .12em;
  color: var(--ink-4);
  text-transform: uppercase;
}
.rd-head .sp { flex: 1 1 auto; }

.mini-btn {
  height: 26px;
  padding: 0 8px;
  display: inline-flex;
  align-items: center;
  gap: 4px;
  border-radius: var(--radius-xs);
  border: 1px solid var(--line);
  background: var(--surface);
  color: var(--ink-2);
  font-size: 11.5px;
  transition: border-color .14s, background .14s, color .14s, transform .1s;
}
.mini-btn:hover { border-color: var(--ink-4); color: var(--ink); }
.mini-btn:active { transform: scale(.97); }
.mini-btn.primary { background: var(--ink); border-color: var(--ink); color: var(--surface); }
.mini-btn.primary:hover { background: var(--ink-2); border-color: var(--ink-2); }
.mini-btn[data-on="1"] { color: var(--brand); border-color: var(--brand); background: var(--brand-soft); }

.rd-body { padding: 18px 22px 64px; }

.rd-kicker {
  display: flex;
  align-items: center;
  gap: 6px;
  font-size: 11px;
  color: var(--ink-4);
  margin-bottom: 8px;
}
.rd-kicker .pill { font-size: 10px; }

.rd-title {
  margin: 0 0 12px;
  font-family: var(--font-serif);
  font-size: 21px;
  line-height: 1.45;
  font-weight: 700;
  letter-spacing: .2px;
  color: var(--ink);
  text-wrap: pretty;
}

.rd-meta {
  display: grid;
  grid-template-columns: auto 1fr;
  gap: 5px 12px;
  padding: 11px 12px;
  border-radius: var(--radius-sm);
  background: var(--surface-2);
  border: 1px solid var(--line-2);
  font-size: 11.5px;
  color: var(--ink-2);
  margin-bottom: 18px;
}
.rd-meta dt { color: var(--ink-4); white-space: nowrap; }
.rd-meta dd { margin: 0; min-width: 0; word-break: break-word; }
.rd-meta code {
  font-family: var(--font-mono);
  font-size: 11px;
  background: var(--surface);
  border: 1px solid var(--line-2);
  padding: 1px 5px;
  border-radius: 3px;
  cursor: copy;
}
.rd-meta code:hover { border-color: var(--brand); color: var(--brand); }

.rd-sec {
  margin: 0 0 22px;
}
.rd-sec-t {
  display: flex;
  align-items: center;
  gap: 7px;
  font-size: 11px;
  letter-spacing: .1em;
  text-transform: uppercase;
  color: var(--ink-4);
  margin-bottom: 8px;
}
.rd-sec-t::after { content: ""; flex: 1 1 auto; height: 1px; background: var(--line-2); }

.brief {
  padding: 12px 14px;
  border-radius: var(--radius-sm);
  background: var(--jade-soft);
  border-left: 2px solid var(--jade);
  font-size: 12.5px;
  line-height: 1.75;
  color: var(--ink-2);
}
.brief b {
  display: inline-block;
  font-family: var(--font-mono);
  font-size: 9px;
  letter-spacing: .1em;
  color: var(--jade);
  margin-bottom: 4px;
}

.rd-text {
  font-family: var(--font-serif);
  font-size: 16px;
  line-height: 1.95;
  color: var(--ink);
  letter-spacing: .2px;
  word-break: break-word;
}
.rd-text p { margin: 0 0 1.05em; }
.rd-text p:last-child { margin-bottom: 0; }
.rd-text .lead {
  color: var(--ink-2);
  font-size: 15px;
}
.rd-text.clamp { max-height: 40vh; overflow: hidden; position: relative; }
.rd-text.clamp::after {
  content: "";
  position: absolute; left: 0; right: 0; bottom: 0; height: 80px;
  background: linear-gradient(180deg, transparent, var(--surface));
}
.expand-btn {
  margin-top: 8px;
  font-size: 11.5px;
  color: var(--brand);
  border-bottom: 1px dashed color-mix(in srgb, var(--brand) 40%, transparent);
  padding-bottom: 1px;
}

.rd-tags { display: flex; flex-wrap: wrap; gap: 5px; }
.rd-tags .t {
  font-size: 11px;
  padding: 2px 7px;
  border-radius: 4px;
  background: var(--surface-2);
  color: var(--ink-3);
  border: 1px solid var(--line-2);
}

.att a {
  display: flex;
  align-items: center;
  gap: 6px;
  font-size: 12px;
  color: var(--ink-2);
  text-decoration: none;
  padding: 5px 0;
  border-bottom: 1px dashed var(--line-2);
}
.att a:hover { color: var(--brand); }

.rd-rel { border-top: 1px solid var(--line-2); padding-top: 12px; }
.rd-rel a {
  display: block;
  padding: 7px 0;
  font-size: 12.5px;
  color: var(--ink-2);
  text-decoration: none;
  border-bottom: 1px solid var(--line-2);
  overflow: hidden;
  white-space: nowrap;
  text-overflow: ellipsis;
}
.rd-rel a:hover { color: var(--brand); }

.rd-empty { padding: 26px 22px 60px; }
.rd-empty h2 {
  margin: 0 0 4px;
  font-family: var(--font-serif);
  font-size: 19px;
  letter-spacing: .2px;
}
.rd-empty .sub { margin: 0 0 18px; color: var(--ink-3); font-size: 12.5px; }

.stat-grid {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 8px;
  margin-bottom: 20px;
}
.stat {
  padding: 10px 11px;
  border-radius: var(--radius-sm);
  border: 1px solid var(--line-2);
  background: var(--surface-2);
}
.stat b {
  display: block;
  font-family: var(--font-mono);
  font-size: 18px;
  letter-spacing: -.03em;
  color: var(--ink);
  line-height: 1.2;
}
.stat i { font-style: normal; font-size: 10.5px; color: var(--ink-4); }

.quick-list { display: flex; flex-direction: column; gap: 1px; }
.quick-list a {
  display: grid;
  grid-template-columns: minmax(0, 1fr) auto;
  gap: 8px;
  align-items: center;
  padding: 8px 0;
  border-bottom: 1px solid var(--line-2);
  text-decoration: none;
  color: var(--ink-2);
  font-size: 12.5px;
}
.quick-list a span { overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
.quick-list a time { font-family: var(--font-mono); font-size: 10px; color: var(--ink-4); }
.quick-list a:hover { color: var(--brand); }

.kbd-grid { display: grid; grid-template-columns: auto 1fr; gap: 6px 10px; font-size: 11.5px; color: var(--ink-3); }
.kbd-grid kbd {
  font-family: var(--font-mono);
  font-size: 10px;
  border: 1px solid var(--line);
  border-bottom-width: 2px;
  border-radius: 4px;
  padding: 1px 5px;
  background: var(--surface);
  justify-self: start;
}

/* ---------------- 指令台 ⌘K ---------------- */

.scrim {
  position: fixed;
  inset: 0;
  z-index: 100;
  background: rgba(18, 23, 28, .42);
  background: color-mix(in srgb, var(--ink) 42%, transparent);
  backdrop-filter: blur(3px);
  -webkit-backdrop-filter: blur(3px);
  animation: fade .16s var(--ease);
}
.scrim[hidden] { display: none; }
@keyframes fade { from { opacity: 0; } }

.omni {
  position: fixed;
  z-index: 110;
  top: 12vh;
  left: 50%;
  transform: translateX(-50%);
  width: min(680px, calc(100vw - 32px));
  max-height: 68vh;
  display: flex;
  flex-direction: column;
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: 14px;
  box-shadow: var(--shadow-3);
  overflow: hidden;
  animation: pop .18s var(--ease);
}
.omni[hidden] { display: none; }
@keyframes pop { from { opacity: 0; transform: translateX(-50%) translateY(-6px) scale(.99); } }

.omni-in {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 13px 16px;
  border-bottom: 1px solid var(--line-2);
}
.omni-in svg { color: var(--ink-4); flex: 0 0 auto; }
.omni-in input {
  flex: 1 1 auto;
  border: 0;
  outline: none;
  background: none;
  font-size: 15.5px;
  letter-spacing: .1px;
}
.omni-in input::placeholder { color: var(--ink-4); }
.omni-in .esc {
  font-family: var(--font-mono);
  font-size: 9.5px;
  color: var(--ink-4);
  border: 1px solid var(--line);
  border-radius: 4px;
  padding: 2px 5px;
}

.omni-body { overflow-y: auto; padding: 6px; }
.omni-group {
  font-family: var(--font-mono);
  font-size: 9.5px;
  letter-spacing: .14em;
  text-transform: uppercase;
  color: var(--ink-4);
  padding: 9px 10px 4px;
}
.omni-item {
  display: grid;
  grid-template-columns: 24px minmax(0, 1fr) auto;
  gap: 10px;
  align-items: center;
  padding: 8px 10px;
  border-radius: var(--radius-sm);
  cursor: pointer;
  color: var(--ink-2);
}
.omni-item .ic {
  width: 24px; height: 24px;
  display: grid; place-items: center;
  border-radius: 6px;
  background: var(--surface-2);
  border: 1px solid var(--line-2);
  font-size: 11px;
  color: var(--ink-3);
}
.omni-item .tx { min-width: 0; }
.omni-item .tx b {
  display: block;
  font-weight: 500;
  font-size: 13px;
  color: var(--ink);
  overflow: hidden;
  white-space: nowrap;
  text-overflow: ellipsis;
}
.omni-item .tx i {
  font-style: normal;
  display: block;
  font-size: 10.5px;
  color: var(--ink-4);
  overflow: hidden;
  white-space: nowrap;
  text-overflow: ellipsis;
}
.omni-item .hint {
  font-family: var(--font-mono);
  font-size: 9.5px;
  color: var(--ink-4);
  border: 1px solid var(--line);
  border-radius: 4px;
  padding: 2px 5px;
}
.omni-item[aria-selected="true"] { background: var(--surface-2); }
.omni-item[aria-selected="true"] .ic { background: var(--brand-soft); color: var(--brand); border-color: transparent; }

.omni-foot {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 7px 14px;
  border-top: 1px solid var(--line-2);
  background: var(--surface-2);
  font-size: 10.5px;
  color: var(--ink-4);
}
.omni-foot kbd {
  font-family: var(--font-mono);
  font-size: 9px;
  border: 1px solid var(--line);
  border-radius: 3px;
  padding: 1px 4px;
  background: var(--surface);
  margin-right: 3px;
}

/* ---------------- AI 顾问 ---------------- */

.ai-drawer {
  position: fixed;
  z-index: 108;
  top: 0; right: 0; bottom: 0;
  width: min(440px, 100vw);
  display: flex;
  flex-direction: column;
  background: var(--surface);
  border-left: 1px solid var(--line);
  box-shadow: var(--shadow-3);
  animation: slide .22s var(--ease);
}
.ai-drawer[hidden] { display: none; }
@keyframes slide { from { transform: translateX(18px); opacity: 0; } }

.ai-head {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 11px 14px;
  border-bottom: 1px solid var(--line-2);
}
.ai-head .ttl { font-size: 12.5px; font-weight: 600; }
.ai-head .mdl { font-family: var(--font-mono); font-size: 9.5px; color: var(--ink-4); }
.ai-head .sp { flex: 1 1 auto; }

.ai-body { flex: 1 1 auto; overflow-y: auto; padding: 14px 16px 24px; }

.ai-q {
  padding: 9px 11px;
  border-radius: var(--radius-sm);
  background: var(--surface-2);
  border: 1px solid var(--line-2);
  font-size: 12.5px;
  color: var(--ink-2);
  margin-bottom: 12px;
}
.ai-q b { color: var(--ink); font-weight: 600; }

.ai-refs { display: flex; flex-wrap: wrap; gap: 5px; margin-bottom: 14px; }
.ai-ref {
  font-size: 10.5px;
  padding: 3px 7px;
  border-radius: 4px;
  border: 1px solid var(--line);
  background: var(--surface);
  color: var(--ink-3);
  max-width: 100%;
  overflow: hidden;
  white-space: nowrap;
  text-overflow: ellipsis;
}
.ai-ref:hover { border-color: var(--brand); color: var(--brand); }

.ai-ans {
  font-family: var(--font-serif);
  font-size: 15px;
  line-height: 1.9;
  color: var(--ink);
  white-space: pre-wrap;
  word-break: break-word;
  min-height: 40px;
}
.ai-ans .cur::after {
  content: "";
  display: inline-block;
  width: 2px; height: 15px;
  background: var(--brand);
  vertical-align: -2px;
  margin-left: 1px;
  animation: blink 1s step-end infinite;
}
@keyframes blink { 50% { opacity: 0; } }

.ai-warn {
  margin-top: 14px;
  padding: 8px 10px;
  border-radius: var(--radius-sm);
  background: var(--amber-soft);
  border-left: 2px solid var(--amber);
  font-size: 11px;
  color: var(--ink-2);
  line-height: 1.6;
}

.ai-foot {
  padding: 10px 12px;
  border-top: 1px solid var(--line-2);
  display: flex;
  gap: 6px;
  align-items: flex-end;
  background: var(--surface);
}
.ai-foot textarea {
  flex: 1 1 auto;
  resize: none;
  height: 38px;
  max-height: 120px;
  padding: 9px 10px;
  border-radius: var(--radius-sm);
  border: 1px solid var(--line);
  background: var(--surface-2);
  font-size: 12.5px;
  line-height: 1.4;
  outline: none;
}
.ai-foot textarea:focus { border-color: var(--brand); background: var(--surface); }
.ai-foot .send {
  height: 38px;
  padding: 0 14px;
  border-radius: var(--radius-sm);
  background: var(--ink);
  color: var(--surface);
  font-size: 12.5px;
}
.ai-foot .send:disabled { opacity: .4; cursor: not-allowed; }

/* ---------------- 设置 ---------------- */

.sheet {
  position: fixed;
  z-index: 112;
  top: 50%; left: 50%;
  transform: translate(-50%, -50%);
  width: min(520px, calc(100vw - 28px));
  max-height: 86vh;
  overflow-y: auto;
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: 14px;
  box-shadow: var(--shadow-3);
  animation: pop .18s var(--ease);
}
.sheet[hidden] { display: none; }
.sheet-hd {
  display: flex; align-items: center;
  padding: 14px 18px;
  border-bottom: 1px solid var(--line-2);
}
.sheet-hd b { font-size: 14px; }
.sheet-hd .sp { flex: 1 1 auto; }
.sheet-bd { padding: 16px 18px 8px; }
.field { margin-bottom: 14px; }
.field label { display: block; font-size: 11.5px; color: var(--ink-3); margin-bottom: 5px; }
.field input[type="text"], .field input[type="password"], .field select {
  width: 100%;
  height: 34px;
  padding: 0 10px;
  border-radius: var(--radius-sm);
  border: 1px solid var(--line);
  background: var(--surface-2);
  font-size: 12.5px;
  outline: none;
}
.field input:focus, .field select:focus { border-color: var(--brand); background: var(--surface); }
.field .hint { font-size: 10.5px; color: var(--ink-4); margin-top: 5px; line-height: 1.5; }
.field.row { display: flex; align-items: center; gap: 8px; }
.field.row input { width: auto; }
.sheet-ft {
  display: flex; gap: 8px; justify-content: flex-end;
  padding: 12px 18px 16px;
}
.btn {
  height: 32px;
  padding: 0 14px;
  border-radius: var(--radius-sm);
  border: 1px solid var(--line);
  background: var(--surface);
  font-size: 12.5px;
  color: var(--ink-2);
}
.btn:hover { border-color: var(--ink-4); color: var(--ink); }
.btn.primary { background: var(--ink); border-color: var(--ink); color: var(--surface); }
.btn.primary:hover { background: var(--ink-2); }

/* ---------------- 提示与更新条 ---------------- */

.toasts {
  position: fixed;
  z-index: 130;
  left: 50%;
  bottom: calc(var(--status-h) + 14px);
  transform: translateX(-50%);
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 8px;
  pointer-events: none;
}
.toast {
  pointer-events: auto;
  display: flex;
  align-items: center;
  gap: 9px;
  padding: 9px 14px;
  border-radius: 999px;
  background: var(--ink);
  color: var(--surface);
  font-size: 12px;
  box-shadow: var(--shadow-2);
  animation: rise .2s var(--ease);
  max-width: min(520px, calc(100vw - 24px));
}
.toast[data-kind="ok"] .ic { color: #7FD8C6; }
.toast[data-kind="warn"] { background: var(--amber); color: #fff; }
.toast[data-kind="err"] { background: var(--brand); color: #fff; }
.toast .ic { display: inline-flex; }
@keyframes rise { from { opacity: 0; transform: translateY(8px); } }

.update-bar {
  position: fixed;
  z-index: 120;
  left: 50%;
  bottom: calc(var(--status-h) + 12px);
  transform: translateX(-50%);
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 9px 10px 9px 16px;
  border-radius: 999px;
  background: var(--surface);
  border: 1px solid var(--line);
  box-shadow: var(--shadow-2);
  font-size: 12px;
  animation: rise .24s var(--ease);
  max-width: calc(100vw - 20px);
}
.update-bar[hidden] { display: none; }
.update-bar .txt { color: var(--ink-2); overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
.update-bar .txt b { color: var(--ink); }
.update-bar .go {
  height: 26px; padding: 0 11px;
  border-radius: 999px;
  background: var(--brand);
  color: #fff;
  font-size: 11.5px;
}
.update-bar .later { color: var(--ink-4); font-size: 11.5px; }

/* 骨架 */

.skel { position: relative; overflow: hidden; background: var(--surface-2); }
.skel::after {
  content: "";
  position: absolute; inset: 0;
  background: linear-gradient(90deg, transparent, color-mix(in srgb, var(--surface) 70%, transparent), transparent);
  animation: shimmer 1.3s infinite;
}
@keyframes shimmer { from { transform: translateX(-100%); } to { transform: translateX(100%); } }
.sk-row { height: 62px; margin: 0 16px; border-bottom: 1px solid var(--line-2); display: flex; align-items: center; gap: 12px; }
.sk-bar { height: 10px; border-radius: 4px; }


/* ---------------- 列表内搜索 ---------------- */

.search {
  display: flex;
  align-items: center;
  gap: 6px;
  height: 28px;
  padding: 0 9px;
  border-radius: var(--radius-sm);
  border: 1px solid transparent;
  background: var(--surface-2);
  flex: 0 1 250px;
  min-width: 120px;
  color: var(--ink-4);
  transition: border-color .14s, background .14s, box-shadow .14s;
}
.search:focus-within {
  border-color: var(--brand);
  background: var(--surface);
  box-shadow: 0 0 0 3px rgba(178, 58, 47, .14);
}
.search input {
  flex: 1 1 auto;
  min-width: 0;
  border: 0;
  outline: none;
  background: none;
  font-size: 12.5px;
  color: var(--ink);
}
.search input::placeholder { color: var(--ink-4); }
.search input::-webkit-search-cancel-button { -webkit-appearance: none; }

/* ---------------- 筛选浮层 ---------------- */

.pop {
  position: fixed;
  z-index: 120;
  width: 286px;
  max-height: 58vh;
  display: flex;
  flex-direction: column;
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: 12px;
  box-shadow: var(--shadow-2);
  overflow: hidden;
  animation: pop .14s var(--ease);
}
.pop-hd {
  display: flex;
  align-items: center;
  padding: 10px 12px;
  border-bottom: 1px solid var(--line-2);
  font-size: 12.5px;
}
.pop-hd .sp { flex: 1 1 auto; }
.pop-x { width: 22px; height: 22px; border-radius: 6px; color: var(--ink-4); font-size: 16px; line-height: 1; }
.pop-x:hover { background: var(--surface-2); color: var(--ink); }
.pop-search {
  margin: 8px 10px 0;
  height: 28px;
  padding: 0 8px;
  border-radius: 6px;
  border: 1px solid var(--line);
  background: var(--surface-2);
  font-size: 12px;
  outline: none;
}
.pop-search:focus { border-color: var(--brand); background: var(--surface); }
.pop-list { overflow-y: auto; padding: 6px; flex: 1 1 auto; max-height: 40vh; }
.pop-item {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 5px 8px;
  border-radius: 6px;
  cursor: pointer;
  font-size: 12.5px;
  color: var(--ink-2);
}
.pop-item:hover { background: var(--surface-2); }
.pop-item .v { flex: 1 1 auto; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.pop-item em { font-style: normal; font-family: var(--font-mono); font-size: 10px; color: var(--ink-4); }
.pop-item input { accent-color: var(--brand); margin: 0; }
.pop-item[data-on="1"] .v { color: var(--ink); font-weight: 600; }
.pop-ft {
  display: flex;
  gap: 8px;
  justify-content: flex-end;
  padding: 8px 10px;
  border-top: 1px solid var(--line-2);
  background: var(--surface-2);
}
.pop-none { padding: 18px; text-align: center; color: var(--ink-4); font-size: 12px; }

/* ---------------- 设置项开关 ---------------- */

.switch { display: flex; align-items: flex-start; gap: 8px; font-size: 11.5px; color: var(--ink-3); line-height: 1.5; }
.switch input { accent-color: var(--brand); margin: 2px 0 0; flex: 0 0 auto; }

/* ---------------- 阅读窗操作区 ---------------- */

.rd-actions { display: flex; gap: 7px; flex-wrap: wrap; margin: 0 0 22px; }
.rd-close { display: none; }

/* ---------------- 响应式 ---------------- */

@media (max-width: 1180px) {
  :root { --reader-w: 0px; }
  .bench { grid-template-columns: minmax(0, 1fr); }
  .pane-reader {
    position: fixed;
    z-index: 105;
    top: 0; right: 0; bottom: 0;
    width: min(560px, 100vw);
    height: 100vh;
    max-height: none;
    border-left: 1px solid var(--line);
    box-shadow: var(--shadow-3);
    transform: translateX(102%);
    transition: transform .26s var(--ease);
    visibility: hidden;
  }

<script>/* ---- core.js ---- */
/* ============================================================
   核心层：存储 / 缓存 / 同步 / 数据 / 检索
   —— 无 DOM 依赖，便于单测与后续拆包
   ============================================================ */
'use strict';

var App = window.App || {};

(function (App) {

  /* ---------------- 基础工具 ---------------- */

  var U = App.util = {};

  U.fmt = function (n) {
    return (n == null || isNaN(n)) ? '—' : Number(n).toLocaleString('zh-CN');
  };

  U.pad = function (n) { return (n < 10 ? '0' : '') + n; };

  U.today = function (d) {
    d = d || new Date();
    return d.getFullYear() + '-' + U.pad(d.getMonth() + 1) + '-' + U.pad(d.getDate());
  };

  U.clock = function (d) {
    d = d || new Date();
    return U.pad(d.getHours()) + ':' + U.pad(d.getMinutes());
  };

  U.daysBetween = function (a, b) {
    var t1 = Date.parse(String(a).replace(/(\d{4})年(\d{1,2})月(\d{1,2})日/, '$1-$2-$3'));
    var t2 = b ? Date.parse(b) : Date.now();
    if (isNaN(t1)) return null;
    return Math.round((t2 - t1) / 86400000);
  };

  U.debounce = function (fn, wait) {
    var t = 0;
    return function () {
      var args = arguments, self = this;
      clearTimeout(t);
      t = setTimeout(function () { fn.apply(self, args); }, wait);
    };
  };

  U.hash = function (s) {
    var h = 5381, i = 0, len = s.length;
    for (; i < len; i++) h = ((h << 5) + h + s.charCodeAt(i)) | 0;
    return (h >>> 0).toString(36);
  };

  /** 归一化：全角转半角、小写、去空白与标点。检索与高亮共用。 */
  U.norm = function (s) {
    if (!s) return '';
    s = String(s);
    var out = '', i = 0, c, code;
    for (; i < s.length; i++) {
      c = s.charCodeAt(i);
      if (c >= 0xFF01 && c <= 0xFF5E) c -= 0xFEE0;
      else if (c === 0x3000) c = 0x20;
      if (c === 0x20 || c === 0x09 || c === 0x0A || c === 0x0D) continue;
      code = String.fromCharCode(c);
      if (/[\u3000-\u303F\uFF00-\uFFEF]/.test(code)) continue;
      if (/[，。、；：！？“”‘’（）《》〈〉【】—…·,.;:!?"'()\[\]{}<>\-—_/\\|~`@#$%^&*+=]/.test(code)) continue;
      out += code;
    }
    return out.toLowerCase();
  };

  U.escapeRe = function (s) { return String(s).replace(/[.*+?^${}()|[\]\\]/g, '\\$&'); };

  U.safeUrl = function (u) {
    if (!u) return '';
    u = String(u).trim();
    if (!/^https?:\/\//i.test(u)) return '';
    try { return new URL(u).href; } catch (e) { return ''; }
  };

  /* ---------------- 本地存储（file:// / 隐私模式降级） ---------------- */

  var store = App.store = (function () {
    var ok = false, mem = {};
    try {
      var k = '__tsq_probe__';
      window.localStorage.setItem(k, '1');
      window.localStorage.removeItem(k);
      ok = true;
    } catch (e) { ok = false; }

    return {
      usable: ok,
      get: function (key, def) {
        try {
          var v = ok ? window.localStorage.getItem(key) : mem[key];
          return v == null ? def : JSON.parse(v);
        } catch (e) { return def; }
      },
      set: function (key, val) {
        var s = JSON.stringify(val);
        try {
          if (ok) { window.localStorage.setItem(key, s); return true; }
        } catch (e) { /* 配额满 → 降级内存 */ }
        mem[key] = s;
        return false;
      },
      del: function (key) {
        try { if (ok) window.localStorage.removeItem(key); } catch (e) {}
        delete mem[key];
      }
    };
  })();

  /* ---------------- IndexedDB 资源缓存 ---------------- */

  var idb = App.idb = (function () {
    var DB = 'tsq-desk', VER = 1, STORE = 'kv', dbp = null;

    function race(p, ms, fallback) {
      return new Promise(function (resolve) {
        var done = false;
        var t = setTimeout(function () { if (!done) { done = true; resolve(fallback); } }, ms);
        p.then(function (v) { if (!done) { done = true; clearTimeout(t); resolve(v); } },
          function () { if (!done) { done = true; clearTimeout(t); resolve(fallback); } });
      });
    }

    function open() {
      if (dbp) return dbp;
      dbp = new Promise(function (resolve, reject) {
        if (!window.indexedDB) return reject(new Error('no-idb'));
        var req = indexedDB.open(DB, VER);
        req.onupgradeneeded = function () {
          var db = req.result;
          if (!db.objectStoreNames.contains(STORE)) db.createObjectStore(STORE);
          if (!db.objectStoreNames.contains('assets')) db.createObjectStore('assets');
        };
        req.onsuccess = function () { resolve(req.result); };
        req.onerror = function () { reject(req.error || new Error('idb-open-failed')); };
        req.onblocked = function () { reject(new Error('idb-blocked')); };
      });
      return dbp;
    }

    function tx(storeName, mode, fn) {
      return open().then(function (db) {
        return new Promise(function (resolve, reject) {
          var t = db.transaction(storeName, mode, { durability: 'relaxed' });
          var st = t.objectStore(storeName);
          var out = fn(st);
          t.oncomplete = function () { resolve(out && out.result !== undefined ? out.result : out); };
          t.onerror = function () { reject(t.error); };
          t.onabort = function () { reject(t.error || new Error('idb-abort')); };
        });
      });
    }

    return {
      get: function (key) {
        return race(tx(STORE, 'readonly', function (st) { return st.get(key); }), 1500, null);
      },
      put: function (key, val) {
        return race(tx(STORE, 'readwrite', function (st) { return st.put(val, key); }), 5000, false)
          .then(function (v) { return v !== false; });
      },
      asset: {
        get: function (key) {
          return race(tx('assets', 'readonly', function (st) { return st.get(key); }), 1500, null);
        },
        put: function (key, val) {
          return race(tx('assets', 'readwrite', function (st) { return st.put(val, key); }), 5000, false)
            .then(function (v) { return v !== false; });
        }
      }
    };
  })();

  /* ---------------- 网络：gzip JSON ---------------- */

  var net = App.net = {};

  net.getJSON = function (url, opts) {
    opts = opts || {};
    var ctrl = typeof AbortController !== 'undefined' ? new AbortController() : null;
    var timer = 0;
    var req = { cache: opts.cache || 'default' };
    if (ctrl) {
      req.signal = ctrl.signal;
      timer = setTimeout(function () { ctrl.abort(); }, opts.timeout || 35000);
    }
    return fetch(url, req).then(function (res) {
      if (!res.ok) throw new Error('HTTP ' + res.status);
      return res.text();
    }).then(function (text) {
      clearTimeout(timer);
      return JSON.parse(text);
    }, function (err) {
      clearTimeout(timer);
      if (err && err.name === 'AbortError') throw new Error('请求超时');
      throw err;
    });
  };

  /** 拉 gzip 资源并解压，带下载进度回调（进度的分母取 Content-Length）。 */
  net.getGzipJSON = function (url, onProgress, opts) {
    opts = opts || {};
    var total = 0, got = 0, chunks = [];

    return fetch(url, { cache: 'force-cache' }).then(function (res) {
      if (!res.ok) throw new Error('HTTP ' + res.status);
      total = Number(res.headers.get('content-length') || 0);
      if (!res.body || !res.body.getReader) return res.arrayBuffer().then(toBytes);
      var reader = res.body.getReader();
      return pump(reader);
    }).then(function (bytes) {
      if (typeof opts.onBytes === 'function') { try { opts.onBytes(bytes); } catch (e) {} }
      // 若服务端做过 Content-Encoding 协商，fetch 会已解压 → 靠魔数判断
      var isGzip = bytes.length > 2 && bytes[0] === 0x1f && bytes[1] === 0x8b;
      if (!isGzip) return new TextDecoder('utf-8').decode(bytes);
      if (typeof DecompressionStream === 'undefined') {
        throw new Error('当前浏览器不支持流式解压，请升级到 Chrome 80+ / Safari 16.4+');
      }
      var stream = new Blob([bytes]).stream().pipeThrough(new DecompressionStream('gzip'));
      return new Response(stream).text();
    }).then(function (text) {
      return JSON.parse(text);
    });

    function pump(reader) {
      return reader.read().then(function (r) {
        if (r.done) return concat(chunks, got);
        var chunk = r.value;
        chunks.push(chunk);
        got += chunk.byteLength;
        if (total && typeof onProgress === 'function') {
          onProgress(Math.min(1, got / total), got, total);
        }
        return pump(reader);
      });
    }

    function concat(list, len) {
      var out = new Uint8Array(len), off = 0;
      for (var i = 0; i < list.length; i++) { out.set(list[i], off); off += list[i].byteLength; }
      return out;
    }

    function toBytes(buf) {
      return new Uint8Array(buf);
    }
  };

  /* ---------------- 数据层 ---------------- */

  var D = App.data = {
    manifest: null,
    dataFile: 'data.json.gz',
    libFile: 'library.json.gz',
    clientSafe: false,
    policy: null,          // { m, d }
    lib: null,             // { m, d, byKind }
    base: '',
    version: ''
  };

  D.init = function (opt) {
    opt = opt || {};
    D.base = opt.base || '';
    D.dataFile = opt.dataFile || 'data.json.gz';
    D.libFile = opt.libFile || 'library.json.gz';
    D.clientSafe = !!opt.clientSafe;
  };

  D.url = function (name, v) {
    return D.base + name + (v ? '?v=' + encodeURIComponent(v) : '');
  };

  /** 归一化政策文档：补 id / 年份 / 搜索键。 */
  function normPolicy(rec, i) {
    var id = 'p' + U.hash((rec.n || '') + '|' + (rec.t || '') + '|' + (rec.d || ''));
    var year = (rec.d || '').slice(0, 4);
    return {
      id: id,
      k: 'policy',
      t: rec.t || '(无标题)',
      n: rec.n || '',
      d: rec.d || '',
      y: year,
      u: rec.u || '',
      x: rec.x || rec.c || '',
      c: rec.c || '',
      w: rec.w || '',
      o: rec.o || '',
      p: rec.p || '',
      ws: rec.ws || '',
      s: rec.s || '',
      g: rec.g || '',
      kk: rec.k || '',
      a: rec.a || '',
      at: rec.at || '',
      of: rec.of || '',
      sc: rec.sc || ''
    };
  }

  function normLib(rec, i, kind) {
    var id = 'l' + U.hash(kind + '|' + (rec.u || '') + '|' + (rec.t || ''));
    var dm = /(\d{4})年/.exec(rec.d || '') || /^(\d{4})/.exec(rec.d || '');
    return {
      y: dm ? dm[1] : '',
      id: id,
      k: kind,
      t: rec.t || '(无标题)',
      c: rec.c || '',
      s: rec.s || '',
      d: rec.d || '',
      u: rec.u || '',
      q: rec.q || '',
      src: rec.src || '',
      srcName: 'src' in rec ? (rec.src || '') : '',
      kk: rec.q || ''
    };
  }

  D.setManifest = function (m) {
    D.manifest = m;
    D.version = m.b || '';
    if (m.file) D.dataFile = m.file;
    if (m.lib_file) D.libFile = m.lib_file;
  };

  D.setPolicy = function (payload, version) {
    var list = payload.d || [];
    var docs = new Array(list.length);
    for (var i = 0; i < list.length; i++) docs[i] = normPolicy(list[i], i);
    docs.sort(function (a, b) { return a.d < b.d ? 1 : a.d > b.d ? -1 : 0; });
    D.policy = { m: payload.m || {}, d: docs, version: version || '' };
    return docs;
  };

  D.setLib = function (payload, version) {
    var list = payload.d || [];
    var byKind = {};
    var all = new Array(list.length);
    for (var i = 0; i < list.length; i++) {
      var it = normLib(list[i], i, list[i].y || 'zsk');
      all[i] = it;
      (byKind[it.k] || (byKind[it.k] = [])).push(it);
    }
    D.lib = { m: payload.m || {}, d: all, byKind: byKind, version: version || '' };
    return D.lib;
  };

  D.dataset = function (scope) {
    if (scope === 'policy') return D.policy ? D.policy.d : [];
    if (!D.lib) return [];
    return D.lib.byKind[scope] || [];
  };

  /* ---------------- 同步引擎 ---------------- */

  var S = App.sync = {
